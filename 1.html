<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>追书神器 · 小说站</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #1e2a3a;
            line-height: 1.6;
            padding: 0 0 60px 0;
            min-height: 100vh;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        img {
            display: block;
            max-width: 100%;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ===== 顶部导航 ===== */
        .navbar {
            background: #ffffff;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 10px 0;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #2b6c8f;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo span {
            background: #2b6c8f;
            color: #fff;
            font-size: 14px;
            padding: 0 10px;
            border-radius: 20px;
            line-height: 26px;
        }
        .nav-links {
            display: flex;
            gap: 18px;
            font-size: 15px;
            font-weight: 500;
        }
        .nav-links a {
            color: #4a5a6e;
            transition: color 0.2s;
            cursor: pointer;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #2b6c8f;
            border-bottom-color: #2b6c8f;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #f0f2f5;
            border-radius: 24px;
            padding: 4px 8px 4px 16px;
            transition: all 0.3s;
            flex: 1 1 240px;
            max-width: 320px;
            min-width: 140px;
            position: relative;
        }
        .search-box:focus-within {
            background: #fff;
            box-shadow: 0 0 0 2px #2b6c8f44;
        }
        .search-box input {
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 14px;
            outline: none;
            width: 100%;
            color: #1e2a3a;
        }
        .search-box input::placeholder {
            color: #9aa9b9;
        }
        .search-box button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            color: #6a7a8a;
            transition: color 0.2s;
        }
        .search-box button:hover {
            color: #2b6c8f;
        }
        /* 搜索建议下拉 */
        .suggest-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            margin-top: 4px;
            padding: 6px 0;
            display: none;
            max-height: 260px;
            overflow-y: auto;
            z-index: 200;
        }
        .suggest-dropdown.show {
            display: block;
        }
        .suggest-dropdown .item {
            padding: 8px 18px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s;
        }
        .suggest-dropdown .item:hover {
            background: #f0f4f8;
        }
        .suggest-dropdown .item .highlight {
            color: #2b6c8f;
            font-weight: 600;
        }

        /* ===== 页面容器 ===== */
        .page {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 首页 ===== */
        .hero-banner {
            background: linear-gradient(135deg, #1a3a4a, #2b6c8f);
            color: #fff;
            border-radius: 20px;
            padding: 32px 36px;
            margin: 24px 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .hero-banner h2 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .hero-banner p {
            opacity: 0.85;
            margin-top: 4px;
            font-size: 15px;
        }
        .hero-banner .badge {
            background: rgba(255, 255, 255, 0.18);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 14px;
            backdrop-filter: blur(4px);
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin: 28px 0 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title .more {
            font-size: 14px;
            font-weight: 400;
            color: #7a8a9a;
            cursor: pointer;
            margin-left: auto;
        }
        .section-title .more:hover {
            color: #2b6c8f;
        }

        /* 分类快捷入口 */
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin: 8px 0 4px;
        }
        .cat-grid .cat-card {
            background: #fff;
            border-radius: 14px;
            padding: 16px 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #edf0f4;
            font-weight: 500;
            font-size: 14px;
        }
        .cat-grid .cat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(43, 108, 143, 0.12);
            border-color: #2b6c8f44;
        }
        .cat-grid .cat-card .emoji {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }

        /* 排行榜 & 小说列表 */
        .rank-tabs {
            display: flex;
            gap: 10px;
            margin: 6px 0 16px;
            flex-wrap: wrap;
        }
        .rank-tabs .tab {
            padding: 6px 18px;
            border-radius: 30px;
            background: #eef1f5;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .rank-tabs .tab:hover {
            background: #dce3ec;
        }
        .rank-tabs .tab.active {
            background: #2b6c8f;
            color: #fff;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px 14px;
            margin: 10px 0 20px;
        }
        .book-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.25s;
            cursor: pointer;
            border: 1px solid #edf0f4;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 36px rgba(43, 108, 143, 0.10);
            border-color: #2b6c8f33;
        }
        .book-card .cover {
            width: 100%;
            aspect-ratio: 2/2.8;
            background: #e8edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: #7a8a9a;
            font-weight: 300;
            object-fit: cover;
        }
        .book-card .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .book-card .info {
            padding: 10px 12px 14px;
        }
        .book-card .title {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .book-card .author {
            font-size: 13px;
            color: #7a8a9a;
            margin-top: 2px;
        }
        .book-card .meta {
            font-size: 12px;
            color: #9aa9b9;
            margin-top: 4px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .book-card .meta span {
            background: #f0f4f8;
            padding: 0 8px;
            border-radius: 12px;
            line-height: 20px;
        }

        /* ===== 分类页 ===== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            background: #fff;
            border-radius: 16px;
            padding: 16px 20px;
            margin: 16px 0 20px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.04);
            align-items: center;
        }
        .filter-bar .group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .filter-bar .label {
            font-size: 13px;
            color: #7a8a9a;
            font-weight: 500;
            margin-right: 4px;
        }
        .filter-bar .btn {
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #dee4ec;
            background: #fafbfc;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            color: #4a5a6e;
        }
        .filter-bar .btn:hover {
            background: #eef1f5;
        }
        .filter-bar .btn.active {
            background: #2b6c8f;
            color: #fff;
            border-color: #2b6c8f;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 24px 0 10px;
            flex-wrap: wrap;
        }
        .pagination .page-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #dee4ec;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .pagination .page-btn:hover {
            background: #eef1f5;
        }
        .pagination .page-btn.active {
            background: #2b6c8f;
            color: #fff;
            border-color: #2b6c8f;
        }
        .pagination .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== 详情页 ===== */
        .detail-wrap {
            background: #fff;
            border-radius: 20px;
            padding: 28px 30px;
            margin: 16px 0 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .detail-top {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }
        .detail-cover {
            width: 180px;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            background: #e8edf3;
            aspect-ratio: 2/2.8;
        }
        .detail-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .detail-info {
            flex: 1;
            min-width: 220px;
        }
        .detail-info h1 {
            font-size: 26px;
            font-weight: 700;
        }
        .detail-info .sub {
            color: #7a8a9a;
            font-size: 15px;
            margin: 4px 0 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .detail-info .sub span {
            background: #f0f4f8;
            padding: 0 12px;
            border-radius: 20px;
            line-height: 26px;
            font-size: 13px;
        }
        .detail-info .desc {
            margin: 12px 0 16px;
            color: #3a4a5a;
            font-size: 15px;
            line-height: 1.8;
            max-height: 120px;
            overflow-y: auto;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
        }
        .detail-info .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .detail-info .actions .btn {
            padding: 8px 24px;
            border-radius: 30px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #eef1f5;
            color: #2a3a4a;
        }
        .detail-info .actions .btn.primary {
            background: #2b6c8f;
            color: #fff;
        }
        .detail-info .actions .btn.primary:hover {
            background: #1f5777;
            transform: scale(1.02);
        }
        .detail-info .actions .btn:hover {
            background: #dce3ec;
        }

        /* 章节列表 */
        .chapter-list {
            margin-top: 20px;
            border-top: 1px solid #edf0f4;
            padding-top: 16px;
        }
        .chapter-list .ch-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chapter-list .ch-title .source-switch {
            font-size: 13px;
            font-weight: 400;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .chapter-list .ch-title .source-switch .opt {
            padding: 2px 14px;
            border-radius: 20px;
            background: #eef1f5;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .chapter-list .ch-title .source-switch .opt.active {
            background: #2b6c8f;
            color: #fff;
        }
        .chapters {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 6px 12px;
            max-height: 420px;
            overflow-y: auto;
            padding: 4px 2px;
        }
        .chapters .ch-item {
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #2a3a4a;
        }
        .chapters .ch-item:hover {
            background: #eef4f9;
            color: #2b6c8f;
        }
        .chapters .ch-item .idx {
            color: #9aa9b9;
            margin-right: 6px;
            font-size: 12px;
        }

        /* ===== 阅读器 ===== */
        .reader-wrap {
            background: #fff;
            border-radius: 20px;
            padding: 28px 32px;
            margin: 16px 0 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            min-height: 60vh;
        }
        .reader-wrap .r-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid #edf0f4;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
        .reader-wrap .r-header h2 {
            font-size: 20px;
            font-weight: 600;
        }
        .reader-wrap .r-header .nav-btns {
            display: flex;
            gap: 8px;
        }
        .reader-wrap .r-header .nav-btns .btn {
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid #dee4ec;
            background: #fafbfc;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .reader-wrap .r-header .nav-btns .btn:hover {
            background: #eef1f5;
        }
        .reader-wrap .r-header .nav-btns .btn.primary {
            background: #2b6c8f;
            color: #fff;
            border-color: #2b6c8f;
        }
        .reader-wrap .r-header .nav-btns .btn.primary:hover {
            background: #1f5777;
        }
        .reader-content {
            font-size: 17px;
            line-height: 1.9;
            color: #1e2a3a;
            padding: 8px 4px;
            min-height: 300px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .reader-content p {
            margin-bottom: 12px;
        }
        .reader-content .loading-text {
            color: #9aa9b9;
            text-align: center;
            padding: 60px 0;
            font-size: 16px;
        }

        /* ===== 搜索页 ===== */
        .search-result-stats {
            margin: 16px 0 10px;
            color: #7a8a9a;
            font-size: 14px;
        }
        .search-result-stats strong {
            color: #1e2a3a;
        }

        /* ===== 加载 & 错误 ===== */
        .loading-spinner {
            text-align: center;
            padding: 40px 0;
            color: #7a8a9a;
            font-size: 15px;
        }
        .loading-spinner .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e8edf3;
            border-top-color: #2b6c8f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .error-msg {
            background: #fee8e6;
            color: #b33a34;
            padding: 12px 20px;
            border-radius: 12px;
            margin: 12px 0;
            font-size: 14px;
            border-left: 4px solid #b33a34;
        }
        .empty-msg {
            text-align: center;
            padding: 40px 0;
            color: #9aa9b9;
            font-size: 16px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .navbar .container {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-links {
                justify-content: center;
                gap: 12px;
                font-size: 14px;
                flex-wrap: wrap;
            }
            .search-box {
                max-width: 100%;
                flex: 1 1 auto;
            }
            .hero-banner {
                padding: 24px 20px;
                flex-direction: column;
                text-align: center;
            }
            .hero-banner h2 {
                font-size: 20px;
            }
            .book-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 12px;
            }
            .detail-top {
                flex-direction: column;
                align-items: center;
            }
            .detail-cover {
                width: 140px;
            }
            .detail-info h1 {
                font-size: 22px;
                text-align: center;
            }
            .detail-info .sub {
                justify-content: center;
            }
            .detail-info .desc {
                max-height: 160px;
            }
            .detail-wrap {
                padding: 18px 16px;
            }
            .reader-wrap {
                padding: 18px 16px;
            }
            .reader-wrap .r-header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .reader-wrap .r-header .nav-btns {
                justify-content: center;
            }
            .chapters {
                grid-template-columns: 1fr 1fr;
            }
            .filter-bar {
                padding: 12px 14px;
                gap: 8px;
            }
            .filter-bar .group {
                gap: 4px;
            }
            .filter-bar .btn {
                font-size: 12px;
                padding: 3px 10px;
            }
        }
        @media (max-width: 480px) {
            .book-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 10px;
            }
            .chapters {
                grid-template-columns: 1fr;
            }
            .detail-info .actions .btn {
                padding: 6px 16px;
                font-size: 13px;
            }
            .cat-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            }
            .cat-grid .cat-card {
                padding: 12px 6px;
                font-size: 12px;
            }
            .cat-grid .cat-card .emoji {
                font-size: 22px;
            }
        }

        /* ===== 工具类 ===== */
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .text-center {
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gap-8 {
            gap: 8px;
        }
    </style>
</head>
<body>

    <!-- ===== 导航栏 ===== -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <div class="logo" onclick="navigate('home')">
                📖 追书 <span>API</span>
            </div>
            <div class="nav-links">
                <a class="active" data-page="home">首页</a>
                <a data-page="category">分类</a>
                <a data-page="search">搜索</a>
            </div>
            <div class="search-box" id="searchBox">
                <input type="text" id="searchInput" placeholder="搜小说、作者..." autocomplete="off" />
                <button id="searchBtn">🔍</button>
                <div class="suggest-dropdown" id="suggestDropdown"></div>
            </div>
        </div>
    </nav>

    <!-- ===== 主容器 ===== -->
    <div class="container">

        <!-- ===== 首页 ===== -->
        <div class="page active" id="page-home">
            <div class="hero-banner">
                <div>
                    <h2>📚 发现好书 · 畅快阅读</h2>
                    <p>追书神器 API 驱动 · 百万小说免费看</p>
                </div>
                <div class="badge">🔥 今日热读 12.8w+</div>
            </div>

            <!-- 分类快捷入口 -->
            <div class="section-title">📂 热门分类 <span class="more" onclick="navigate('category')">查看全部 →</span></div>
            <div class="cat-grid" id="quickCats"></div>

            <!-- 排行榜 -->
            <div class="section-title">🏆 排行榜</div>
            <div class="rank-tabs" id="rankTabs"></div>
            <div class="book-grid" id="rankBooks"></div>

            <!-- 热门推荐 -->
            <div class="section-title">🔥 热门推荐</div>
            <div class="book-grid" id="hotBooks"></div>
        </div>

        <!-- ===== 分类页 ===== -->
        <div class="page" id="page-category">
            <div class="filter-bar" id="filterBar">
                <!-- 由 JS 动态渲染 -->
            </div>
            <div class="book-grid" id="categoryBooks"></div>
            <div class="pagination" id="categoryPagination"></div>
        </div>

        <!-- ===== 详情页 ===== -->
        <div class="page" id="page-detail">
            <div id="detailContent"></div>
        </div>

        <!-- ===== 阅读器 ===== -->
        <div class="page" id="page-reader">
            <div id="readerContent"></div>
        </div>

        <!-- ===== 搜索页 ===== -->
        <div class="page" id="page-search">
            <div class="search-result-stats" id="searchStats"></div>
            <div class="book-grid" id="searchResults"></div>
            <div class="pagination" id="searchPagination"></div>
        </div>

    </div>

    <!-- ============================================================ -->
    <script>
        // =============================================================
        //  配置
        // =============================================================
        const PROXY = 'http://65.49.197.99:3000/';
        const API_DOMAIN = 'http://api.zhuishushenqi.com';
        const CHAPTER_DOMAIN = 'http://chapterup.zhuishushenqi.com';
        const API05_DOMAIN = 'http://api05iye5.zhuishushenqi.com';

        // 通过代理请求完整URL
        function proxyUrl(url) {
            return PROXY + url;
        }

        // =============================================================
        //  工具函数
        // =============================================================
        function fetchJSON(url, options = {}) {
            return fetch(proxyUrl(url), {
                    ...options,
                    headers: { 'Accept': 'application/json', ...options.headers }
                })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .catch(err => {
                    console.error('请求失败:', url, err);
                    throw err;
                });
        }

        function get(url) {
            return fetchJSON(url, { method: 'GET' });
        }

        // 防抖
        function debounce(fn, delay = 400) {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        // 简易路由
        let currentPage = 'home';
        let currentParams = {};

        function navigate(page, params = {}) {
            currentPage = page;
            currentParams = params;
            // 更新导航高亮
            document.querySelectorAll('.nav-links a').forEach(a => {
                a.classList.toggle('active', a.dataset.page === page);
            });
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            const target = document.getElementById('page-' + page);
            if (target) {
                target.classList.add('active');
                // 触发渲染
                switch (page) {
                    case 'home':
                        renderHome();
                        break;
                    case 'category':
                        renderCategory(params);
                        break;
                    case 'detail':
                        renderDetail(params.bookId);
                        break;
                    case 'reader':
                        renderReader(params.bookId, params.chapterIndex, params.source);
                        break;
                    case 'search':
                        renderSearch(params.query, params.page || 0);
                        break;
                }
            }
            // 滚动到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // =============================================================
        //  状态缓存
        // =============================================================
        const cache = {
            cats: null, // 所有分类
            subCats: null, // 小分类
            rankList: null, // 排行榜列表
            rankData: {}, // 排行榜数据缓存
            hotBooks: null,
            detail: {},
            chapters: {},
            chapterContent: {},
        };

        // =============================================================
        //  首页渲染
        // =============================================================
        async function renderHome() {
            const container = document.getElementById('page-home');
            if (!container) return;

            // 如果已经渲染过且数据存在，直接显示（但刷新数据）
            try {
                await Promise.all([
                    renderQuickCats(),
                    renderRankTabs(),
                    renderHotBooks(),
                ]);
                // 默认加载第一个排行榜
                if (cache.rankList && cache.rankList.length > 0) {
                    loadRank(cache.rankList[0]._id);
                }
            } catch (e) {
                console.error('首页加载失败', e);
                // 显示错误
            }
        }

        // 快速分类
        async function renderQuickCats() {
            const el = document.getElementById('quickCats');
            if (!el) return;
            try {
                const data = await getCats();
                if (!data || !data.male) return;
                // 取男生、女生、出版各前4个
                const cats = [
                    ...data.male.slice(0, 4),
                    ...data.female.slice(0, 4),
                    ...data.press.slice(0, 4),
                ];
                el.innerHTML = cats.map(c => `
                    <div class="cat-card" onclick="navigate('category', {gender:'${c.gender}', major:'${c.name}'})">
                        <span class="emoji">${getEmoji(c.name)}</span>
                        ${c.name}
                    </div>
                `).join('');
            } catch (e) {
                el.innerHTML = '<div class="error-msg">分类加载失败</div>';
            }
        }

        function getEmoji(name) {
            const map = {
                '玄幻': '🧙',
                '奇幻': '🐉',
                '武侠': '⚔️',
                '仙侠': '🌌',
                '都市': '🏙️',
                '现实': '🌍',
                '历史': '🏛️',
                '军事': '🎖️',
                '游戏': '🎮',
                '体育': '🏅',
                '科幻': '🚀',
                '悬疑': '🔍',
                '言情': '💕',
                '青春': '🌸',
                '文学': '📝',
                '文化': '🎭',
                '生活': '☕',
                '传记': '📖',
                '社科': '📊',
                '经济': '💰',
                '管理': '📋',
                '漫画': '🎨',
                '其他': '📚',
            };
            return map[name] || '📘';
        }

        // 获取所有分类
        async function getCats() {
            if (cache.cats) return cache.cats;
            const data = await get(API_DOMAIN + '/cats/lv2/statistics');
            cache.cats = data;
            return data;
        }

        // 获取小分类
        async function getSubCats() {
            if (cache.subCats) return cache.subCats;
            const data = await get(API_DOMAIN + '/cats/lv2');
            cache.subCats = data;
            return data;
        }

        // 排行榜
        async function renderRankTabs() {
            const el = document.getElementById('rankTabs');
            if (!el) return;
            try {
                const data = await get(API_DOMAIN + '/ranking/gender');
                cache.rankList = data;
                if (!data || data.length === 0) {
                    el.innerHTML = '<span style="color:#9aa9b9;">暂无排行榜</span>';
                    return;
                }
                el.innerHTML = data.map((r, i) =>
                    `<button class="tab ${i===0?'active':''}" data-id="${r._id}">${r.name}</button>`
                ).join('');
                el.querySelectorAll('.tab').forEach(btn => {
                    btn.addEventListener('click', function() {
                        el.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        loadRank(this.dataset.id);
                    });
                });
            } catch (e) {
                el.innerHTML = '<div class="error-msg">排行榜加载失败</div>';
            }
        }

        async function loadRank(rankId) {
            const el = document.getElementById('rankBooks');
            if (!el) return;
            if (cache.rankData[rankId]) {
                renderRankBooks(cache.rankData[rankId], el);
                return;
            }
            el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div>加载中...</div>';
            try {
                const data = await get(API_DOMAIN + '/ranking/' + rankId);
                cache.rankData[rankId] = data;
                renderRankBooks(data, el);
            } catch (e) {
                el.innerHTML = '<div class="error-msg">排行榜数据加载失败</div>';
            }
        }

        function renderRankBooks(data, el) {
            if (!data || !data.ranking || !data.ranking.books) {
                el.innerHTML = '<div class="empty-msg">暂无数据</div>';
                return;
            }
            const books = data.ranking.books.slice(0, 12);
            el.innerHTML = books.map(b => renderBookCard(b)).join('');
        }

        // 热门推荐
        async function renderHotBooks() {
            const el = document.getElementById('hotBooks');
            if (!el) return;
            if (cache.hotBooks) {
                el.innerHTML = cache.hotBooks.map(b => renderBookCard(b)).join('');
                return;
            }
            el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div>加载中...</div>';
            try {
                // 使用分类接口获取热门小说
                const data = await get(API_DOMAIN + '/book/by-categories?gender=male&type=hot&major=玄幻&start=0&limit=12');
                if (data && data.books) {
                    cache.hotBooks = data.books;
                    el.innerHTML = data.books.map(b => renderBookCard(b)).join('');
                } else {
                    el.innerHTML = '<div class="empty-msg">暂无热门推荐</div>';
                }
            } catch (e) {
                el.innerHTML = '<div class="error-msg">热门推荐加载失败</div>';
            }
        }

        // =============================================================
        //  小说卡片渲染
        // =============================================================
        function renderBookCard(book) {
            const cover = book.cover || '';
            const title = book.title || '未知书名';
            const author = book.author || '未知作者';
            const cat = book.cat || '未分类';
            const id = book._id || book.id || '';
            return `
                <div class="book-card" onclick="navigate('detail', {bookId:'${id}'})">
                    <div class="cover">
                        ${cover ? `<img src="${cover}" alt="${title}" loading="lazy" onerror="this.style.display='none';this.parentElement.textContent='📖'"/>` : '📖'}
                    </div>
                    <div class="info">
                        <div class="title">${title}</div>
                        <div class="author">${author}</div>
                        <div class="meta"><span>${cat}</span></div>
                    </div>
                </div>
            `;
        }

        // =============================================================
        //  分类页
        // =============================================================
        let categoryState = {
            gender: 'male',
            type: 'hot',
            major: '玄幻',
            minor: '',
            start: 0,
            limit: 20,
            total: 0,
        };

        async function renderCategory(params = {}) {
            if (params.gender) categoryState.gender = params.gender;
            if (params.major) categoryState.major = params.major;
            if (params.type) categoryState.type = params.type;
            if (params.start !== undefined) categoryState.start = params.start;

            await renderFilterBar();
            await loadCategoryBooks();
        }

        async function renderFilterBar() {
            const el = document.getElementById('filterBar');
            if (!el) return;
            try {
                const cats = await getCats();
                const subCats = await getSubCats();
                const genderMap = { male: '男生', female: '女生', press: '出版' };
                const genders = ['male', 'female', 'press'];
                const types = [
                    { key: 'hot', label: '🔥 热门' },
                    { key: 'new', label: '🆕 新书' },
                    { key: 'repulation', label: '⭐ 好评' },
                    { key: 'over', label: '✅ 完结' },
                    { key: 'month', label: '📦 包月' },
                ];

                // 获取当前性别下的分类列表
                const genderCats = cats[categoryState.gender] || [];
                const majorList = genderCats.map(c => c.name);

                // 获取当前大分类下的小分类
                const subList = subCats[categoryState.gender] || [];
                const minorList = subList
                    .filter(s => s.major === categoryState.major)
                    .map(s => s.name);

                let html = `
                    <div class="group">
                        <span class="label">性别</span>
                        ${genders.map(g => `
                            <button class="btn ${categoryState.gender===g?'active':''}" data-key="gender" data-value="${g}">${genderMap[g]}</button>
                        `).join('')}
                    </div>
                    <div class="group">
                        <span class="label">类型</span>
                        ${types.map(t => `
                            <button class="btn ${categoryState.type===t.key?'active':''}" data-key="type" data-value="${t.key}">${t.label}</button>
                        `).join('')}
                    </div>
                    <div class="group">
                        <span class="label">分类</span>
                        ${majorList.slice(0, 12).map(m => `
                            <button class="btn ${categoryState.major===m?'active':''}" data-key="major" data-value="${m}">${m}</button>
                        `).join('')}
                    </div>
                    ${minorList.length > 0 ? `
                    <div class="group">
                        <span class="label">子类</span>
                        <button class="btn ${!categoryState.minor?'active':''}" data-key="minor" data-value="">全部</button>
                        ${minorList.slice(0, 10).map(m => `
                            <button class="btn ${categoryState.minor===m?'active':''}" data-key="minor" data-value="${m}">${m}</button>
                        `).join('')}
                    </div>
                    ` : ''}
                `;
                el.innerHTML = html;

                // 事件绑定
                el.querySelectorAll('.btn[data-key]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const key = this.dataset.key;
                        const value = this.dataset.value;
                        categoryState[key] = value;
                        if (key === 'gender' || key === 'major') {
                            categoryState.minor = '';
                            categoryState.start = 0;
                        }
                        if (key !== 'start') categoryState.start = 0;
                        renderCategory(categoryState);
                    });
                });

            } catch (e) {
                el.innerHTML = '<div class="error-msg">筛选加载失败</div>';
            }
        }

        async function loadCategoryBooks() {
            const el = document.getElementById('categoryBooks');
            const pg = document.getElementById('categoryPagination');
            if (!el) return;
            const { gender, type, major, minor, start, limit } = categoryState;

            el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div>加载中...</div>';
            pg.innerHTML = '';

            try {
                let url = `${API_DOMAIN}/book/by-categories?gender=${gender}&type=${type}&major=${encodeURIComponent(major)}&start=${start}&limit=${limit}`;
                if (minor) url += `&minor=${encodeURIComponent(minor)}`;
                const data = await get(url);
                if (data && data.books) {
                    categoryState.total = data.total || data.books.length;
                    el.innerHTML = data.books.map(b => renderBookCard(b)).join('');
                    if (data.books.length === 0) {
                        el.innerHTML = '<div class="empty-msg">😅 没有找到相关小说</div>';
                    }
                    renderPagination(pg, start, limit, data.total || data.books.length, (newStart) => {
                        categoryState.start = newStart;
                        loadCategoryBooks();
                    });
                } else {
                    el.innerHTML = '<div class="empty-msg">暂无数据</div>';
                }
            } catch (e) {
                el.innerHTML = '<div class="error-msg">加载失败，请重试</div>';
            }
        }

        // =============================================================
        //  分页组件
        // =============================================================
        function renderPagination(el, start, limit, total, onPage) {
            if (total <= limit) { el.innerHTML = ''; return; }
            const current = Math.floor(start / limit) + 1;
            const totalPages = Math.ceil(total / limit);
            let html = '';
            // 上一页
            html +=
                `<button class="page-btn" ${current<=1?'disabled':''} data-page="${current-1}">‹ 上一页</button>`;
            // 页码
            const showPages = 5;
            let startPage = Math.max(1, current - Math.floor(showPages / 2));
            let endPage = Math.min(totalPages, startPage + showPages - 1);
            if (endPage - startPage < showPages - 1) startPage = Math.max(1, endPage - showPages + 1);
            for (let i = startPage; i <= endPage; i++) {
                html +=
                    `<button class="page-btn ${i===current?'active':''}" data-page="${i}">${i}</button>`;
            }
            html +=
                `<button class="page-btn" ${current>=totalPages?'disabled':''} data-page="${current+1}">下一页 ›</button>`;
            el.innerHTML = html;
            el.querySelectorAll('.page-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (this.disabled) return;
                    const page = parseInt(this.dataset.page);
                    if (isNaN(page)) return;
                    const newStart = (page - 1) * limit;
                    onPage(newStart);
                });
            });
        }

        // =============================================================
        //  小说详情
        // =============================================================
        async function renderDetail(bookId) {
            const el = document.getElementById('detailContent');
            if (!el || !bookId) return;
            el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div>加载中...</div>';

            try {
                // 获取小说信息
                const bookData = await get(API_DOMAIN + '/book/' + bookId);
                cache.detail[bookId] = bookData;

                // 获取章节（使用mix-atoc）
                let chapters = [];
                let sourceId = null;
                let sourceType = 'mix';
                try {
                    const mixData = await get(API_DOMAIN + '/mix-atoc/' + bookId + '?view=chapters');
                    if (mixData && mixData.chapters) {
                        chapters = mixData.chapters;
                        sourceId = mixData._id;
                    }
                } catch (e) {
                    // 尝试btoc
                    try {
                        const btocData = await get(API_DOMAIN + '/btoc?view=summary&book=' + bookId);
                        if (btocData && btocData.length > 0) {
                            const source = btocData[0];
                            sourceId = source._id;
                            sourceType = 'btoc';
                            const chData = await get(API_DOMAIN + '/btoc/' + sourceId + '?view=chapters');
                            if (chData && chData.chapters) chapters = chData.chapters;
                        }
                    } catch (e2) {
                        // 尝试atoc
                        try {
                            const atocData = await get(API_DOMAIN + '/atoc?view=summary&book=' + bookId);
                            if (atocData && atocData.length > 0) {
                                const source = atocData[0];
                                sourceId = source._id;
                                sourceType = 'atoc';
                                const chData = await get(API_DOMAIN + '/atoc/' + sourceId + '?view=chapters');
                                if (chData && chData.chapters) chapters = chData.chapters;
                            }
                        } catch (e3) {}
                    }
                }

                cache.chapters[bookId] = { chapters, sourceId, sourceType };

                // 渲染详情
                renderDetailHTML(el, bookData, chapters, sourceId, sourceType);

            } catch (e) {
                el.innerHTML = `<div class="error-msg">加载详情失败: ${e.message}</div>`;
            }
        }

        function renderDetailHTML(el, book, chapters, sourceId, sourceType) {
            const cover = book.cover || '';
            const title = book.title || '未知书名';
            const author = book.author || '未知作者';
            const cat = book.cat || '未分类';
            const majorCate = book.majorCate || '';
            const minorCate = book.minorCate || '';
            const longIntro = book.longIntro || book.shortIntro || '暂无简介';
            const isFinished = book.isFinished || false;
            const wordCount = book.wordCount || 0;
            const updated = book.updated || '';

            let html = `
                <div class="detail-wrap">
                    <div class="detail-top">
                        <div class="detail-cover">
                            ${cover ? `<img src="${cover}" alt="${title}" onerror="this.style.display='none';this.parentElement.textContent='📖'"/>` : '📖'}
                        </div>
                        <div class="detail-info">
                            <h1>${title}</h1>
                            <div class="sub">
                                <span>✍️ ${author}</span>
                                <span>📂 ${cat}</span>
                                ${majorCate ? `<span>🏷️ ${majorCate}${minorCate?' / '+minorCate:''}</span>` : ''}
                                <span>${isFinished ? '✅ 完结' : '🔄 连载中'}</span>
                                ${wordCount ? `<span>📊 ${(wordCount/10000).toFixed(1)}万字</span>` : ''}
                                ${updated ? `<span>📅 ${updated.slice(0,10)}</span>` : ''}
                            </div>
                            <div class="desc">${longIntro}</div>
                            <div class="actions">
                                ${chapters && chapters.length > 0 ? `<button class="btn primary" onclick="navigate('reader', {bookId:'${book._id}', chapterIndex:0, source:'${sourceId}'})">📖 开始阅读</button>` : ''}
                                <button class="btn" onclick="navigate('category')">⬅ 返回</button>
                            </div>
                        </div>
                    </div>
                    <div class="chapter-list">
                        <div class="ch-title">
                            📑 章节列表
                            <span class="source-switch">
                                <span class="opt active">全部</span>
                            </span>
                            <span style="font-size:13px;font-weight:400;color:#7a8a9a;margin-left:auto;">共 ${chapters ? chapters.length : 0} 章</span>
                        </div>
                        <div class="chapters" id="chapterList">
                            ${chapters && chapters.length > 0 ? chapters.map((ch, idx) => `
                                <div class="ch-item" onclick="navigate('reader', {bookId:'${book._id}', chapterIndex:${idx}, source:'${sourceId}'})">
                                    <span class="idx">${idx+1}</span> ${ch.title || '第'+(idx+1)+'章'}
                                </div>
                            `).join('') : '<div class="empty-msg">暂无章节</div>'}
                        </div>
                    </div>
                </div>
            `;
            el.innerHTML = html;
        }

        // =============================================================
        //  阅读器
        // =============================================================
        async function renderReader(bookId, chapterIndex, sourceId) {
            const el = document.getElementById('readerContent');
            if (!el || !bookId) return;

            // 获取章节列表
            let chapters = [];
            let source = sourceId;
            if (cache.chapters[bookId]) {
                chapters = cache.chapters[bookId].chapters || [];
                source = source || cache.chapters[bookId].sourceId;
            } else {
                try {
                    const mixData = await get(API_DOMAIN + '/mix-atoc/' + bookId + '?view=chapters');
                    if (mixData && mixData.chapters) {
                        chapters = mixData.chapters;
                        source = source || mixData._id;
                    }
                } catch (e) {
                    // 尝试其他源
                    try {
                        const atocData = await get(API_DOMAIN + '/atoc?view=summary&book=' + bookId);
                        if (atocData && atocData.length > 0) {
                            const s = atocData[0];
                            source = source || s._id;
                            const chData = await get(API_DOMAIN + '/atoc/' + source + '?view=chapters');
                            if (chData && chData.chapters) chapters = chData.chapters;
                        }
                    } catch (e2) {}
                }
                cache.chapters[bookId] = { chapters, sourceId: source };
            }

            if (!chapters || chapters.length === 0) {
                el.innerHTML = '<div class="error-msg">没有找到章节数据</div>';
                return;
            }

            // 确保索引有效
            let idx = Math.min(Math.max(0, chapterIndex || 0), chapters.length - 1);
            const chapter = chapters[idx];
            if (!chapter) {
                el.innerHTML = '<div class="error-msg">章节不存在</div>';
                return;
            }

            // 获取章节内容
            const link = chapter.link;
            let content = '<div class="loading-text">📖 加载中...</div>';

            // 先渲染框架
            renderReaderFrame(el, bookId, idx, chapters.length, chapter.title || '第' + (idx + 1) + '章', content, idx > 0, idx <
                chapters.length - 1);

            // 加载内容
            try {
                let contentUrl = '';
                if (link) {
                    if (link.startsWith('http')) {
                        contentUrl = CHAPTER_DOMAIN + '/chapter/' + link;
                    } else {
                        contentUrl = CHAPTER_DOMAIN + '/chapter/' + link;
                    }
                } else {
                    // 尝试用sourceId获取
                    if (source) {
                        const chData = await get(API_DOMAIN + '/atoc/' + source + '?view=chapters');
                        if (chData && chData.chapters && chData.chapters[idx]) {
                            const l = chData.chapters[idx].link;
                            if (l) contentUrl = CHAPTER_DOMAIN + '/chapter/' + l;
                        }
                    }
                }

                if (contentUrl) {
                    const raw = await fetch(proxyUrl(contentUrl), { method: 'GET' });
                    const text = await raw.text();
                    // 尝试提取正文内容
                    let body = text;
                    // 简单清洗
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');
                    const bodyEl = doc.querySelector('body') || doc;
                    // 移除script/style
                    bodyEl.querySelectorAll('script, style, link').forEach(el => el.remove());
                    // 提取正文
                    let contentText = bodyEl.textContent || bodyEl.innerText || text;
                    // 如果内容过少，尝试直接使用文本
                    if (contentText.length < 50) {
                        // 尝试按段落分割
                        const paragraphs = bodyEl.querySelectorAll('p, div');
                        if (paragraphs.length > 1) {
                            contentText = Array.from(paragraphs).map(p => p.textContent).filter(t => t.trim().length > 0)
                                .join('\n\n');
                        }
                    }
                    // 进一步清洗
                    contentText = contentText.replace(/\s+/g, ' ').trim();
                    // 如果还是太少，可能是直接返回了文本
                    if (contentText.length < 20 && text.length > 100) {
                        contentText = text.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
                    }
                    // 按段落分割显示
                    const paragraphs = contentText.split(/\n{2,}|\r\n{2,}/).filter(p => p.trim().length > 0);
                    if (paragraphs.length > 0) {
                        content = paragraphs.map(p => `<p>${p.trim()}</p>`).join('');
                    } else {
                        content = `<p>${contentText || '（内容为空）'}</p>`;
                    }
                } else {
                    content = '<p>无法获取章节内容</p>';
                }
            } catch (e) {
                console.error('获取章节内容失败', e);
                content = '<p style="color:#b33a34;">内容加载失败，请重试</p>';
            }

            // 更新内容
            const contentEl = el.querySelector('.reader-content');
            if (contentEl) contentEl.innerHTML = content;
        }

        function renderReaderFrame(el, bookId, idx, total, title, content, hasPrev, hasNext) {
            el.innerHTML = `
                <div class="reader-wrap">
                    <div class="r-header">
                        <h2>${title}</h2>
                        <div class="nav-btns">
                            <button class="btn" ${!hasPrev?'disabled':''} onclick="navigate('reader', {bookId:'${bookId}', chapterIndex:${idx-1}})">‹ 上一章</button>
                            <button class="btn primary" onclick="navigate('detail', {bookId:'${bookId}'})">📑 目录</button>
                            <button class="btn" ${!hasNext?'disabled':''} onclick="navigate('reader', {bookId:'${bookId}', chapterIndex:${idx+1}})">下一章 ›</button>
                        </div>
                    </div>
                    <div class="reader-content">
                        ${content}
                    </div>
                    <div style="text-align:center;margin-top:20px;color:#9aa9b9;font-size:13px;">
                        第 ${idx+1} / ${total} 章
                    </div>
                </div>
            `;
        }

        // =============================================================
        //  搜索
        // =============================================================
        let searchState = {
            query: '',
            page: 0,
            limit: 20,
            total: 0,
        };

        async function renderSearch(query, page = 0) {
            const el = document.getElementById('searchResults');
            const stats = document.getElementById('searchStats');
            const pg = document.getElementById('searchPagination');
            if (!el) return;

            searchState.query = query;
            searchState.page = page;

            if (!query || query.trim() === '') {
                // 显示搜索热词
                try {
                    const hotwords = await get(API_DOMAIN + '/book/search-hotwords');
                    const words = hotwords || ['玄幻', '都市', '仙侠', '武侠', '科幻', '悬疑', '言情', '历史'];
                    stats.innerHTML = `<span style="color:#7a8a9a;">🔥 热门搜索：</span> ${words.map(w => `<span style="display:inline-block;background:#eef1f5;padding:2px 14px;border-radius:20px;margin:4px 4px;cursor:pointer;font-size:14px;" onclick="doSearch('${w}')">${w}</span>`).join('')}`;
                    el.innerHTML = '<div class="empty-msg">输入关键词搜索小说</div>';
                    pg.innerHTML = '';
                } catch (e) {
                    stats.innerHTML = '输入关键词搜索小说';
                    el.innerHTML = '<div class="empty-msg">🔍 试试搜索吧</div>';
                }
                return;
            }

            stats.innerHTML = `搜索 "<strong>${query}</strong>" ...`;
            el.innerHTML = '<div class="loading-spinner"><div class="spinner"></div>搜索中...</div>';
            pg.innerHTML = '';

            try {
                const url =
                    `${API_DOMAIN}/book/fuzzy-search?query=${encodeURIComponent(query)}&start=${page*searchState.limit}&limit=${searchState.limit}`;
                const data = await get(url);
                if (data && data.books) {
                    searchState.total = data.total || data.books.length;
                    stats.innerHTML =
                        `找到 <strong>${searchState.total}</strong> 本相关小说 (第 ${page+1} 页)`;
                    el.innerHTML = data.books.map(b => renderBookCard(b)).join('');
                    if (data.books.length === 0) {
                        el.innerHTML = '<div class="empty-msg">😅 没有找到相关小说</div>';
                    }
                    renderPagination(pg, page * searchState.limit, searchState.limit, searchState.total, (newStart) => {
                        const newPage = Math.floor(newStart / searchState.limit);
                        renderSearch(query, newPage);
                    });
                } else {
                    el.innerHTML = '<div class="empty-msg">没有找到相关小说</div>';
                }
            } catch (e) {
                el.innerHTML = '<div class="error-msg">搜索失败，请重试</div>';
            }
        }

        function doSearch(query) {
            document.getElementById('searchInput').value = query;
            navigate('search', { query: query, page: 0 });
            document.getElementById('suggestDropdown').classList.remove('show');
        }

        // =============================================================
        //  搜索自动补全
        // =============================================================
        function setupSearchAutoComplete() {
            const input = document.getElementById('searchInput');
            const dropdown = document.getElementById('suggestDropdown');
            const searchBtn = document.getElementById('searchBtn');

            const fetchSuggest = debounce(async (query) => {
                if (!query || query.trim().length < 1) {
                    dropdown.classList.remove('show');
                    return;
                }
                try {
                    const data = await get(API_DOMAIN + '/book/auto-complete?query=' + encodeURIComponent(query));
                    if (data && data.length > 0) {
                        dropdown.innerHTML = data.map(item =>
                            `<div class="item" data-query="${item}">${highlightMatch(item, query)}</div>`
                        ).join('');
                        dropdown.classList.add('show');
                    } else {
                        dropdown.classList.remove('show');
                    }
                } catch (e) {
                    dropdown.classList.remove('show');
                }
            }, 300);

            input.addEventListener('input', function() {
                const val = this.value.trim();
                if (val.length > 0) {
                    fetchSuggest(val);
                } else {
                    dropdown.classList.remove('show');
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const val = this.value.trim();
                    if (val) {
                        doSearch(val);
                        dropdown.classList.remove('show');
                    }
                }
                // 上下键选择
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    const items = dropdown.querySelectorAll('.item');
                    if (items.length === 0) return;
                    e.preventDefault();
                    let current = dropdown.querySelector('.item.active');
                    let idx = -1;
                    if (current) {
                        idx = Array.from(items).indexOf(current);
                        current.classList.remove('active');
                    }
                    if (e.key === 'ArrowDown') {
                        idx = Math.min(idx + 1, items.length - 1);
                    } else {
                        idx = Math.max(idx - 1, 0);
                    }
                    items[idx].classList.add('active');
                    items[idx].scrollIntoView({ block: 'nearest' });
                }
                if (e.key === 'Escape') {
                    dropdown.classList.remove('show');
                }
            });

            dropdown.addEventListener('click', function(e) {
                const item = e.target.closest('.item');
                if (item) {
                    const query = item.dataset.query;
                    if (query) doSearch(query);
                }
            });

            // 点击外部关闭
            document.addEventListener('click', function(e) {
                if (!e.target.closest('#searchBox')) {
                    dropdown.classList.remove('show');
                }
            });

            searchBtn.addEventListener('click', function() {
                const val = input.value.trim();
                if (val) doSearch(val);
            });

            // 搜索框自动聚焦
            document.querySelector('.nav-links a[data-page="search"]').addEventListener('click', function() {
                setTimeout(() => document.getElementById('searchInput').focus(), 100);
            });
        }

        function highlightMatch(text, query) {
            const idx = text.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) return text;
            const before = text.slice(0, idx);
            const match = text.slice(idx, idx + query.length);
            const after = text.slice(idx + query.length);
            return `${before}<span class="highlight">${match}</span>${after}`;
        }

        // =============================================================
        //  导航链接点击
        // =============================================================
        document.querySelectorAll('.nav-links a').forEach(a => {
            a.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.dataset.page;
                if (page === 'search') {
                    navigate('search', { query: '' });
                    setTimeout(() => document.getElementById('searchInput').focus(), 150);
                } else {
                    navigate(page);
                }
            });
        });

        // =============================================================
        //  初始化
        // =============================================================
        async function init() {
            setupSearchAutoComplete();
            // 首页渲染
            await renderHome();

            // 处理URL参数（如果有）
            const hash = window.location.hash;
            if (hash) {
                const params = new URLSearchParams(hash.replace('#', ''));
                const page = params.get('page') || 'home';
                const bookId = params.get('bookId') || '';
                const query = params.get('query') || '';
                const idx = parseInt(params.get('idx')) || 0;
                if (page === 'detail' && bookId) {
                    navigate('detail', { bookId });
                } else if (page === 'reader' && bookId) {
                    navigate('reader', { bookId, chapterIndex: idx });
                } else if (page === 'search' && query) {
                    navigate('search', { query });
                } else {
                    navigate('home');
                }
            }
        }

        // 暴露全局函数给HTML使用
        window.navigate = navigate;
        window.doSearch = doSearch;

        // 启动
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
