<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>📚 小说书库 - 在线小说阅读</title>
    <style>
        /* ========================================
                   CSS 变量 & 主题
                ======================================== */
        :root {
            --bg-primary: #f5f0eb;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --bg-hover: #f0e8e0;
            --text-primary: #3d2c1a;
            --text-secondary: #6b5a4a;
            --text-muted: #a09080;
            --text-inverse: #ffffff;
            --border-color: #e8e0d8;
            --shadow-color: rgba(61, 44, 26, 0.08);
            --shadow-hover: rgba(61, 44, 26, 0.15);
            --accent: #c0392b;
            --accent-hover: #a93226;
            --accent-light: #f5d0cb;
            --radius: 12px;
            --radius-sm: 8px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-serif: "Georgia", "Times New Roman", "Songti SC", "SimSun", serif;
            --transition: 0.25s ease;
            --header-height: 64px;
            --max-width: 820px;
            --reading-font-size: 18px;
            --reading-line-height: 1.9;
        }

        /* 夜间模式 */
        [data-theme="dark"] {
            --bg-primary: #1a1410;
            --bg-secondary: #241e18;
            --bg-card: #2d241e;
            --bg-input: #2d241e;
            --bg-hover: #3d322a;
            --text-primary: #e8ddd0;
            --text-secondary: #c4b5a5;
            --text-muted: #8a7a6a;
            --border-color: #3d322a;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.5);
            --accent: #e67e6b;
            --accent-hover: #d96c57;
            --accent-light: #4d322a;
        }

        /* ========================================
                   重置 & 基础
                ======================================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color var(--transition), color var(--transition);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
            font-size: inherit;
        }

        input {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
            border: none;
            background: none;
            outline: none;
        }

        /* ========================================
                   滚动条
                ======================================== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* ========================================
                   工具类
                ======================================== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .mt-8 {
            margin-top: 8px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .mt-24 {
            margin-top: 24px;
        }
        .mt-32 {
            margin-top: 32px;
        }
        .mb-16 {
            margin-bottom: 16px;
        }
        .mb-24 {
            margin-bottom: 24px;
        }

        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========================================
                   Header
                ======================================== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            transition: background var(--transition), border-color var(--transition);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.88);
        }
        [data-theme="dark"] .app-header {
            background-color: rgba(26, 20, 16, 0.92);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: var(--header-height);
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .btn-back {
            display: none;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-hover);
            font-size: 18px;
            transition: background var(--transition);
            flex-shrink: 0;
        }
        .btn-back:hover {
            background: var(--border-color);
        }
        .btn-back.visible {
            display: flex;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo span {
            color: var(--accent);
        }

        .header-search {
            flex: 1;
            max-width: 400px;
            min-width: 0;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 0 16px;
            transition: border-color var(--transition), box-shadow var(--transition);
            height: 38px;
        }
        .header-search:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .header-search input {
            flex: 1;
            background: transparent;
            padding: 6px 0;
            font-size: 14px;
            min-width: 0;
        }
        .header-search input::placeholder {
            color: var(--text-muted);
        }
        .header-search .search-icon {
            color: var(--text-muted);
            font-size: 16px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .header-search .btn-submit {
            color: var(--accent);
            font-weight: 600;
            font-size: 14px;
            padding: 4px 0 4px 12px;
            flex-shrink: 0;
            transition: color var(--transition);
        }
        .header-search .btn-submit:hover {
            color: var(--accent-hover);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: transparent;
            transition: background var(--transition);
        }
        .btn-icon:hover {
            background: var(--bg-hover);
        }

        /* ========================================
                   视图容器
                ======================================== */
        .view {
            display: none;
            animation: fadeUp 0.3s ease;
            padding: 20px 0 40px;
            flex: 1;
        }
        .view.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================================
                   首页视图
                ======================================== */
        .home-hero {
            text-align: center;
            padding: 40px 0 20px;
        }
        .home-hero h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .home-hero h1 span {
            color: var(--accent);
        }
        .home-hero p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .home-search-box {
            max-width: 560px;
            margin: 28px auto 0;
            display: flex;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            padding: 4px 4px 4px 20px;
            transition: border-color var(--transition), box-shadow var(--transition);
            box-shadow: 0 4px 20px var(--shadow-color);
        }
        .home-search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 4px 30px var(--shadow-hover);
        }
        .home-search-box input {
            flex: 1;
            padding: 14px 0;
            font-size: 16px;
            background: transparent;
            min-width: 0;
        }
        .home-search-box input::placeholder {
            color: var(--text-muted);
        }
        .home-search-box .btn-search {
            padding: 10px 28px;
            background: var(--accent);
            color: #fff;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 16px;
            transition: background var(--transition);
            white-space: nowrap;
        }
        .home-search-box .btn-search:hover {
            background: var(--accent-hover);
        }

        .hot-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
        }
        .hot-tags .tag {
            padding: 6px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all var(--transition);
            cursor: pointer;
        }
        .hot-tags .tag:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }

        /* ========================================
                   搜索结果 / 章节列表 / 阅读
                ======================================== */
        .view-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-bottom: 20px;
        }
        .view-title {
            font-size: 20px;
            font-weight: 600;
        }
        .view-title .count {
            font-weight: 400;
            font-size: 15px;
            color: var(--text-secondary);
            margin-left: 8px;
        }
        .view-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .view-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .view-controls .sort-btn {
            padding: 4px 14px;
            border-radius: 16px;
            font-size: 13px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            transition: all var(--transition);
        }
        .view-controls .sort-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .view-controls .sort-btn:hover:not(.active) {
            border-color: var(--accent);
        }

        /* ========================================
                   小说卡片列表
                ======================================== */
        .book-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .book-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px 20px;
            transition: all var(--transition);
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow-color);
        }
        .book-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--shadow-hover);
            border-color: var(--accent);
        }
        .book-card .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .book-card .title .badge {
            font-size: 12px;
            font-weight: 400;
            background: var(--accent-light);
            color: var(--accent);
            padding: 0 10px;
            border-radius: 12px;
            line-height: 22px;
        }
        .book-card .meta {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
        }
        .book-card .meta .author {
            font-weight: 500;
        }
        .book-card .meta .new-chapter {
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 300px;
        }

        /* ========================================
                   章节列表
                ======================================== */
        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .chapter-item {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        .chapter-item:last-child {
            border-bottom: none;
        }
        .chapter-item:hover {
            background: var(--bg-hover);
        }
        .chapter-item .ch-index {
            color: var(--text-muted);
            font-size: 13px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .chapter-item .ch-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chapter-item .ch-arrow {
            color: var(--text-muted);
            font-size: 14px;
            flex-shrink: 0;
            margin-left: 12px;
        }

        /* ========================================
                   分页
                ======================================== */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .pagination .page-btn {
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            transition: all var(--transition);
            font-size: 14px;
            min-width: 36px;
            text-align: center;
        }
        .pagination .page-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }
        .pagination .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination .page-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .pagination .page-info {
            color: var(--text-secondary);
            font-size: 14px;
            padding: 0 8px;
        }

        /* ========================================
                   阅读视图
                ======================================== */
        .reading-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .reading-header .book-title {
            font-size: 20px;
            font-weight: 600;
        }
        .reading-header .chapter-title {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .reading-content {
            font-family: var(--font-serif);
            font-size: var(--reading-font-size);
            line-height: var(--reading-line-height);
            background: var(--bg-card);
            padding: 32px 28px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            min-height: 300px;
            box-shadow: 0 2px 12px var(--shadow-color);
            word-break: break-word;
        }
        .reading-content p {
            margin-bottom: 0.8em;
            text-indent: 2em;
        }
        .reading-content p:last-child {
            margin-bottom: 0;
        }

        .reading-nav {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .reading-nav .nav-btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            text-align: center;
            transition: all var(--transition);
            font-size: 14px;
            font-weight: 500;
        }
        .reading-nav .nav-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }
        .reading-nav .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .reading-nav .nav-btn .label {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
        }

        /* ========================================
                   加载 & 空状态
                ======================================== */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .loading-state .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }
        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--accent);
        }
        .error-state .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .error-state p {
            font-size: 15px;
        }

        /* ========================================
                   字体控制 (阅读页)
                ======================================== */
        .font-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .font-controls .font-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
            border: 1px solid var(--border-color);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .font-controls .font-btn:hover {
            border-color: var(--accent);
            background: var(--accent-light);
        }
        .font-controls .font-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .font-controls .font-size-display {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 0 6px;
            min-width: 36px;
            text-align: center;
        }

        /* ========================================
                   响应式
                ======================================== */
        @media (max-width: 640px) {
            :root {
                --header-height: 56px;
                --reading-font-size: 16px;
                --reading-line-height: 1.8;
            }

            .container {
                padding: 0 14px;
            }

            .logo {
                font-size: 17px;
            }
            .logo .full {
                display: none;
            }

            .header-search {
                height: 34px;
                padding: 0 12px;
                flex: 1;
                min-width: 0;
            }
            .header-search input {
                font-size: 13px;
            }
            .header-search .btn-submit {
                font-size: 13px;
                padding-left: 8px;
            }
            .header-search .search-icon {
                font-size: 14px;
                margin-right: 4px;
            }

            .btn-icon {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
            .btn-back {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            .home-hero h1 {
                font-size: 24px;
            }
            .home-hero p {
                font-size: 14px;
            }
            .home-search-box {
                margin-top: 20px;
                padding-left: 14px;
            }
            .home-search-box input {
                padding: 10px 0;
                font-size: 15px;
            }
            .home-search-box .btn-search {
                padding: 8px 18px;
                font-size: 14px;
            }

            .book-card {
                padding: 14px 16px;
            }
            .book-card .title {
                font-size: 16px;
            }

            .chapter-item {
                padding: 10px 14px;
                font-size: 14px;
            }
            .chapter-item .ch-index {
                font-size: 12px;
                margin-right: 8px;
            }

            .reading-content {
                padding: 20px 16px;
                font-size: var(--reading-font-size);
            }

            .reading-nav .nav-btn {
                padding: 10px 12px;
                font-size: 13px;
                min-width: 70px;
            }

            .view-title {
                font-size: 17px;
            }
            .view-title .count {
                font-size: 13px;
            }

            .pagination .page-btn {
                padding: 4px 12px;
                font-size: 13px;
                min-width: 32px;
            }

            .reading-header .book-title {
                font-size: 17px;
            }
            .reading-header .chapter-title {
                font-size: 14px;
            }
        }

        @media (max-width: 420px) {
            .header-search .search-icon {
                display: none;
            }
            .home-search-box {
                flex-wrap: wrap;
                background: transparent;
                border: none;
                box-shadow: none;
                padding: 0;
                gap: 10px;
            }
            .home-search-box input {
                background: var(--bg-card);
                border: 2px solid var(--border-color);
                border-radius: var(--radius-sm);
                padding: 12px 16px;
                flex: 1 1 100%;
            }
            .home-search-box .btn-search {
                flex: 1;
                padding: 12px;
                border-radius: var(--radius-sm);
            }
            .home-search-box:focus-within {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================
    HEADER
    ======================================== -->
    <header class="app-header" id="appHeader">
        <div class="container header-inner">
            <div class="header-left">
                <button class="btn-back" id="btnBack" aria-label="返回">‹</button>
                <div class="logo">
                    📚 <span class="full">小说书库</span>
                </div>
            </div>

            <div class="header-search" id="headerSearch">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索小说..." autocomplete="off" />
                <button class="btn-submit" id="searchSubmit">搜索</button>
            </div>

            <div class="header-actions">
                <button class="btn-icon" id="themeToggle" aria-label="切换主题" title="切换主题">🌙</button>
            </div>
        </div>
    </header>

    <!-- ========================================
    MAIN
    ======================================== -->
    <main class="container">

        <!-- ===== 首页视图 ===== -->
        <section class="view active" id="viewHome">
            <div class="home-hero">
                <h1>📖 畅享<span>阅读</span>时光</h1>
                <p>海量小说，随时畅读 · 简洁纯粹，沉浸体验</p>
            </div>

            <div class="home-search-box">
                <input type="text" id="homeSearchInput" placeholder="输入书名或作者..." autocomplete="off" />
                <button class="btn-search" id="homeSearchBtn">搜 索</button>

            <div class="hot-tags" id="hotTags">
                <span class="tag" data-keyword="劫天运">🔥 劫天运</span>
                <span class="tag" data-keyword="斗罗大陆">斗罗大陆</span>
                <span class="tag" data-keyword="凡人修仙传">凡人修仙传</span>
                <span class="tag" data-keyword="诡秘之主">诡秘之主</span>
                <span class="tag" data-keyword="大奉打更人">大奉打更人</span>
                <span class="tag" data-keyword="剑来">剑来</span>

        <!-- ===== 搜索结果视图 ===== -->
        <section class="view" id="viewSearch">
            <div class="view-header">
                <div class="view-title" id="searchResultTitle">搜索结果 <span class="count" id="searchCount"></span></div>
                <div class="view-subtitle" id="searchKeyword"></div>
            </div>
            <div id="searchResultList"></div>
            <div class="pagination" id="searchPagination"></div>
        </section>

        <!-- ===== 章节列表视图 ===== -->
        <section class="view" id="viewChapters">
            <div class="view-header">
                <div class="view-title" id="chapterTitle">章节列表 <span class="count" id="chapterCount"></span></div>
                <div class="view-controls">
                    <button class="sort-btn active" data-sort="0" id="sortAsc">正序</button>
                    <button class="sort-btn" data-sort="1" id="sortDesc">倒序</button>
                </div>
            </div>
            <div id="chapterList"></div>
            <div class="pagination" id="chapterPagination"></div>
        </section>

        <!-- ===== 阅读视图 ===== -->
        <section class="view" id="viewReading">
            <div class="reading-header">
                <div>
                    <div class="book-title" id="readingBookTitle">—</div>
                    <div class="chapter-title" id="readingChapterTitle">—</div>
                </div>
                <div class="font-controls">
                    <button class="font-btn" data-size="14" title="小字号">A<small>−</small></button>
                    <button class="font-btn active" data-size="18" title="默认字号">A</button>
                    <button class="font-btn" data-size="22" title="大字号">A<small>+</small></button>
                    <span class="font-size-display" id="fontSizeDisplay">18</span>
                </div>
            </div>

            <div class="reading-content" id="readingContent">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                </div>
            </div>

            <div class="reading-nav">
                <button class="nav-btn" id="prevChapter" disabled>
                    <span class="label">上一章</span>
                    <span id="prevChapterTitle">—</span>
                </button>
                <button class="nav-btn" id="nextChapter" disabled>
                    <span class="label">下一章</span>

    <!-- ========================================

    ======================================== -->
    <footer style="text-align:center;padding:24px 0 20px;font-size:13px;color:var(--text-muted);border-top:1px solid var(--border-color);margin-top:auto;">
        <div class="container">
            📚 小说书库 · 数据来源于 <a href="https://walkline.wang/books/api/" target="_blank" style="color:var(--accent);">私人书库 Lite API</a>
            · 仅供学习交流使用
        </div>
    </footer>

    <!-- ========================================
    JAVASCRIPT
    ======================================== -->
    <script>
        (function() {
            'use strict';

            // ========================================
            // 配置
            // ========================================
            const API_BASE = 'https://walkline.wang/books/api/v1';
            const ENDPOINTS = {
                search: '/bookinfo',
                chapters: '/bookchapters',
                content: '/articlecontents',
            };

            // ========================================
            // DOM 引用
            // ========================================
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const views = {
                home: $('#viewHome'),
                search: $('#viewSearch'),
                chapters: $('#viewChapters'),
                reading: $('#viewReading'),
            };

            const dom = {
                // 搜索
                searchInput: $('#searchInput'),
                searchSubmit: $('#searchSubmit'),
                homeSearchInput: $('#homeSearchInput'),
                homeSearchBtn: $('#homeSearchBtn'),
                hotTags: $('#hotTags'),

                // 返回
                btnBack: $('#btnBack'),

                // 搜索结果
                searchResultTitle: $('#searchResultTitle'),
                searchCount: $('#searchCount'),
                searchKeyword: $('#searchKeyword'),
                searchResultList: $('#searchResultList'),
                searchPagination: $('#searchPagination'),

                // 章节
                chapterTitle: $('#chapterTitle'),
                chapterCount: $('#chapterCount'),
                chapterList: $('#chapterList'),
                chapterPagination: $('#chapterPagination'),
                sortAsc: $('#sortAsc'),
                sortDesc: $('#sortDesc'),

                // 阅读
                readingBookTitle: $('#readingBookTitle'),
                readingChapterTitle: $('#readingChapterTitle'),
                readingContent: $('#readingContent'),
                prevChapter: $('#prevChapter'),
                nextChapter: $('#nextChapter'),
                prevChapterTitle: $('#prevChapterTitle'),
                nextChapterTitle: $('#nextChapterTitle'),

                // 字体
                fontBtns: $$('.font-btn'),
                fontSizeDisplay: $('#fontSizeDisplay'),

                // 主题
                themeToggle: $('#themeToggle'),

                // header
                headerSearch: $('#headerSearch'),
            };

            // ========================================
            // 状态
            // ========================================
            const state = {
                // 当前视图: 'home' | 'search' | 'chapters' | 'reading'
                view: 'home',

                // 搜索
                searchKeyword: '',
                searchPage: 1,
                searchTotal: 0,
                searchResults: [],

                // 章节
                bid: '',
                bookTitle: '',
                chapters: [],
                chapterPage: 1,
                chapterPageSize: 30,
                chapterSort: 0, // 0=正序, 1=倒序
                chapterTotal: 0,

                // 阅读
                currentBid: '',
                currentArticleId: '',
                currentChapterTitle: '',
                prevArticle: { id: 0, title: '' },
                nextArticle: { id: 0, title: '' },

                // 历史记录 (存储已读章节)
                history: {},

                // 字体大小
                fontSize: 18,

                // 主题: 'light' | 'dark'
                theme: 'light',
            };

            // ========================================
            // 工具函数
            // ========================================
            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            function safeStr(v) { return v || ''; }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function getApiUrl(endpoint) {
                return API_BASE + endpoint;
            }

            // 简洁的 fetch 封装
            async function apiRequest(endpoint, params) {
                const url = getApiUrl(endpoint);
                const formData = new URLSearchParams();
                for (const [key, val] of Object.entries(params)) {
                    if (val !== undefined && val !== null && val !== '') {
                        formData.append(key, String(val));
                    }
                }
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData.toString(),
                });
                if (!resp.ok) {
                    throw new Error(`HTTP ${resp.status}`);
                }
                const data = await resp.json();
                // 检查业务错误码 (简单处理)
                if (data.code && data.code !== 0) {
                    throw new Error(data.message || `错误码 ${data.code}`);
                }
                return data;
            }

            // ========================================
            // 视图切换
            // ========================================
            function showView(viewName) {
                // 隐藏所有
                Object.values(views).forEach(v => v.classList.remove('active'));
                // 显示目标
                if (views[viewName]) {
                    views[viewName].classList.add('active');
                }
                state.view = viewName;
                // 返回按钮显隐
                const showBack = (viewName !== 'home');
                dom.btnBack.classList.toggle('visible', showBack);
                // 聚焦搜索
                if (viewName === 'home') {
                    dom.homeSearchInput.focus();
                }
                // 更新标题
                document.title = getTitleForView(viewName);
            }

            function getTitleForView(viewName) {
                switch (viewName) {
                    case 'home':
                        return '📚 小说书库 - 在线小说阅读';
                    case 'search':
                        return `「${state.searchKeyword}」搜索结果 - 小说书库`;
                    case 'chapters':
                        return `${state.bookTitle || '小说'} 章节列表 - 小说书库`;
                    case 'reading':
                        return `${state.currentChapterTitle || '阅读中'} - 小说书库`;
                    default:
                        return '📚 小说书库';
                }
            }

            // ========================================
            // 返回上一级
            // ========================================
            function goBack() {
                switch (state.view) {
                    case 'search':
                        showView('home');
                        break;
                    case 'chapters':
                        showView('search');
                        // 重新渲染搜索结果
                        renderSearchResults();
                        break;
                    case 'reading':
                        showView('chapters');
                        renderChapters();
                        break;
                    default:
                        showView('home');
                }
            }

            // ========================================
            // 渲染: 加载状态
            // ========================================
            function renderLoading(container) {
                container.innerHTML = `
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <p>加载中，请稍候...</p>
                        </div>
                    `;
            }

            function renderEmpty(container, msg = '没有找到相关内容') {
                container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <h3>${msg}</h3>
                            <p>试试其他关键词吧</p>
                        </div>
                    `;
            }

            function renderError(container, msg = '加载失败，请稍后重试') {
                container.innerHTML = `
                        <div class="error-state">
                            <div class="icon">⚠️</div>
                            <p>${escapeHtml(msg)}</p>
                        </div>
                    `;
            }

            // ========================================
            // 搜索
            // ========================================
            async function doSearch(keyword, page = 1) {
                if (!keyword || keyword.trim() === '') {
                    dom.homeSearchInput.focus();
                    return;
                }
                keyword = keyword.trim();
                state.searchKeyword = keyword;
                state.searchPage = page;

                // 切换到搜索视图
                showView('search');
                dom.searchKeyword.textContent = `“${escapeHtml(keyword)}”`;
                dom.searchResultTitle.innerHTML = `搜索结果 <span class="count" id="searchCount">加载中...</span>`;
                renderLoading(dom.searchResultList);
                dom.searchPagination.innerHTML = '';

                try {
                    const data = await apiRequest(ENDPOINTS.search, {
                        search: keyword,
                        page: page,
                    });
                    // data: { search, count, lists: [{ bid, title, author, new_chapter }] }
                    state.searchResults = data.lists || [];
                    state.searchTotal = data.count || 0;
                    renderSearchResults();
                } catch (err) {
                    console.error('搜索失败:', err);
                    renderError(dom.searchResultList, err.message || '搜索失败，请稍后重试');
                    dom.searchPagination.innerHTML = '';
                    dom.searchCount.textContent = '加载失败';
                }
            }

            function renderSearchResults() {
                const list = dom.searchResultList;
                const count = state.searchTotal;
                const results = state.searchResults;

                dom.searchCount.textContent = count > 0 ? `共 ${count} 本` : '';

                if (count === 0 || results.length === 0) {
                    renderEmpty(list, '没有找到相关小说');
                    dom.searchPagination.innerHTML = '';
                    return;
                }

                let html = '<div class="book-list">';
                for (const book of results) {
                    const bid = safeStr(book.bid);
                    const title = safeStr(book.title);
                    const author = safeStr(book.author).replace(/^连载\|-\s*作者：/, '').replace(/^作者：/, '');
                    const newChapter = safeStr(book.new_chapter).replace(/^更至:/, '').replace(/^更至：/, '');
                    html += `
                            <div class="book-card" data-bid="${escapeHtml(bid)}" data-title="${escapeHtml(title)}">
                                <div class="title">
                                    ${escapeHtml(title)}
                                    <span class="badge">📖</span>
                                </div>
                                <div class="meta">
                                    <span class="author">✍️ ${escapeHtml(author || '未知作者')}</span>
                                    ${newChapter ? `<span class="new-chapter">📌 ${escapeHtml(newChapter)}</span>` : ''}
                                </div>
                            </div>
                        `;
                }
                html += '</div>';
                list.innerHTML = html;

                // 绑定点击事件 - 进入章节列表
                list.querySelectorAll('.book-card').forEach(el => {
                    el.addEventListener('click', function() {
                        const bid = this.dataset.bid;
                        const title = this.dataset.title;
                        if (bid) {
                            openChapters(bid, title);
                        }
                    });
                });

                // 分页
                const totalPages = Math.ceil(count / 10);
                renderPagination(dom.searchPagination, state.searchPage, totalPages, (p) => {
                    doSearch(state.searchKeyword, p);
                });
            }

            // ========================================
            // 章节列表
            // ========================================
            async function openChapters(bid, bookTitle) {
                if (!bid) return;
                state.bid = bid;
                state.bookTitle = bookTitle || '小说';
                state.chapterPage = 1;
                // 重置排序为正序
                state.chapterSort = 0;
                dom.sortAsc.classList.add('active');
                dom.sortDesc.classList.remove('active');

                showView('chapters');
                dom.chapterTitle.innerHTML = `《${escapeHtml(state.bookTitle)}》<span class="count" id="chapterCount">加载中...</span>`;
                renderLoading(dom.chapterList);
                dom.chapterPagination.innerHTML = '';

                await fetchChapters();
            }

            async function fetchChapters() {
                const bid = state.bid;
                const page = state.chapterPage;
                const pageSize = state.chapterPageSize;
                const sort = state.chapterSort;

                try {
                    const data = await apiRequest(ENDPOINTS.chapters, {
                        bid: bid,
                        page: page,
                        pagesize: pageSize,
                        sort: sort,
                    });
                    // data: { total_chapters_count, chapters: { count, lists: [{ bid, article_title, article_id }] } }
                    state.chapterTotal = data.total_chapters_count || 0;
                    state.chapters = data.chapters?.lists || [];
                    renderChapters();
                } catch (err) {
                    console.error('获取章节列表失败:', err);
                    renderError(dom.chapterList, err.message || '获取章节列表失败');
                    dom.chapterPagination.innerHTML = '';
                    dom.chapterCount.textContent = '加载失败';
                }
            }

            function renderChapters() {
                const list = dom.chapterList;
                const total = state.chapterTotal;
                const chapters = state.chapters;

                dom.chapterCount.textContent = total > 0 ? `共 ${total} 章` : '';

                if (total === 0 || chapters.length === 0) {
                    renderEmpty(list, '暂无章节');
                    dom.chapterPagination.innerHTML = '';
                    return;
                }

                let html = '<div class="chapter-list">';
                // 判断是否倒序显示序号
                const isDesc = state.chapterSort === 1;
                const startIndex = (state.chapterPage - 1) * state.chapterPageSize + 1;
                for (let i = 0; i < chapters.length; i++) {
                    const ch = chapters[i];
                    const articleId = safeStr(ch.article_id);
                    const title = safeStr(ch.article_title);
                    // 计算序号
                    let idx;
                    if (isDesc) {
                        idx = total - ((state.chapterPage - 1) * state.chapterPageSize + i);
                    } else {
                        idx = startIndex + i;
                    }
                    html += `
                            <div class="chapter-item" data-article-id="${escapeHtml(articleId)}" data-title="${escapeHtml(title)}">
                                <span class="ch-index">${idx}</span>
                                <span class="ch-title">${escapeHtml(title)}</span>
                                <span class="ch-arrow">›</span>
                            </div>
                        `;
                }
                html += '</div>';
                list.innerHTML = html;

                // 绑定点击 - 进入阅读
                list.querySelectorAll('.chapter-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const articleId = this.dataset.articleId;
                        const title = this.dataset.title;
                        if (articleId) {
                            openReading(state.bid, articleId, title);
                        }
                    });
                });

                // 分页
                const totalPages = Math.ceil(total / state.chapterPageSize);
                renderPagination(dom.chapterPagination, state.chapterPage, totalPages, (p) => {
                    state.chapterPage = p;
                    fetchChapters();
                });
            }

            // ========================================
            // 阅读
            // ========================================
            async function openReading(bid, articleId, chapterTitle) {
                if (!bid || !articleId) return;
                state.currentBid = bid;
                state.currentArticleId = articleId;
                state.currentChapterTitle = chapterTitle || '加载中...';

                showView('reading');
                dom.readingBookTitle.textContent = state.bookTitle || '小说';
                dom.readingChapterTitle.textContent = state.currentChapterTitle;

                // 重置导航
                dom.prevChapter.disabled = true;
                dom.nextChapter.disabled = true;
                dom.prevChapterTitle.textContent = '—';
                dom.nextChapterTitle.textContent = '—';

                // 显示加载
                dom.readingContent.innerHTML = `
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <p>加载章节内容...</p>
                        </div>
                    `;

                try {
                    const data = await apiRequest(ENDPOINTS.content, {
                        bid: bid,
                        article_id: articleId,
                    });
                    // data: { prev_article: { id, title }, next_article: { id, title }, article: { id, title, content } }
                    const article = data.article || {};
                    const prev = data.prev_article || { id: 0, title: '' };
                    const next = data.next_article || { id: 0, title: '' };

                    state.prevArticle = prev;
                    state.nextArticle = next;

                    const content = article.content || '（本章内容为空）';
                    // 将 <br> 转换为段落
                    let contentHtml = content;
                    // 如果内容包含 <br>，按 <br> 分段
                    if (contentHtml.includes('<br>') || contentHtml.includes('<br/>') || contentHtml.includes('<br />')) {
                        const parts = contentHtml.split(/<br\s*\/?>/i);
                        contentHtml = parts.filter(p => p.trim()).map(p => `<p>${p.trim()}</p>`).join('');
                    } else {
                        // 如果没有 <br>，按换行分段
                        const parts = contentHtml.split(/\n/);
                        contentHtml = parts.filter(p => p.trim()).map(p => `<p>${p.trim()}</p>`).join('');
                    }
                    // 如果仍然没有段落，包裹为一段
                    if (!contentHtml.trim()) {
                        contentHtml = `<p>${content}</p>`;
                    }

                    dom.readingContent.innerHTML = contentHtml;

                    // 更新章节标题（可能API返回的更准确）
                    if (article.title) {
                        state.currentChapterTitle = article.title;
                        dom.readingChapterTitle.textContent = article.title;
                    }

                    // 更新导航
                    const prevId = parseInt(prev.id) || 0;
                    const nextId = parseInt(next.id) || 0;

                    if (prevId > 0 && prev.title) {
                        dom.prevChapter.disabled = false;
                        dom.prevChapterTitle.textContent = prev.title;
                    } else {
                        dom.prevChapter.disabled = true;
                        dom.prevChapterTitle.textContent = '已是第一章';
                    }

                    if (nextId > 0 && next.title) {
                        dom.nextChapter.disabled = false;
                        dom.nextChapterTitle.textContent = next.title;
                    } else {
                        dom.nextChapter.disabled = true;
                        dom.nextChapterTitle.textContent = '已是最后一章';
                    }

                    // 保存阅读历史
                    saveHistory(bid, articleId, state.currentChapterTitle);

                    // 滚动到顶部
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                } catch (err) {
                    console.error('获取章节内容失败:', err);
                    dom.readingContent.innerHTML = `
                            <div class="error-state">
                                <div class="icon">⚠️</div>
                                <p>${escapeHtml(err.message || '加载章节内容失败，请稍后重试')}</p>
                            </div>
                        `;
                }
            }

            // ========================================
            // 上下章导航
            // ========================================
            function goPrevChapter() {
                const prevId = parseInt(state.prevArticle.id) || 0;
                if (prevId > 0 && state.prevArticle.title) {
                    openReading(state.currentBid, String(prevId), state.prevArticle.title);
                }
            }

            function goNextChapter() {
                const nextId = parseInt(state.nextArticle.id) || 0;
                if (nextId > 0 && state.nextArticle.title) {
                    openReading(state.currentBid, String(nextId), state.nextArticle.title);
                }
            }

            // ========================================
            // 阅读历史 (localStorage)
            // ========================================
            function saveHistory(bid, articleId, title) {
                try {
                    const key = `book_history_${bid}`;
                    const record = {
                        bid: bid,
                        articleId: articleId,
                        title: title,
                        timestamp: Date.now(),
                    };
                    localStorage.setItem(key, JSON.stringify(record));
                } catch (_) { /* ignore */ }
            }

            function loadHistory(bid) {
                try {
                    const key = `book_history_${bid}`;
                    const data = localStorage.getItem(key);
                    if (data) {
                        return JSON.parse(data);
                    }
                } catch (_) { /* ignore */ }
                return null;
            }

            // ========================================
            // 分页组件
            // ========================================
            function renderPagination(container, current, total, onPage) {
                if (total <= 1) {
                    container.innerHTML = '';
                    return;
                }
                let html = '';
                // 上一页
                const prevDisabled = current <= 1;
                html += `<button class="page-btn" data-page="${current - 1}" ${prevDisabled ? 'disabled' : ''}>‹</button>`;

                // 页码
                const maxShow = 7;
                let start = Math.max(1, current - Math.floor(maxShow / 2));
                let end = Math.min(total, start + maxShow - 1);
                if (end - start < maxShow - 1) {
                    start = Math.max(1, end - maxShow + 1);
                }
                if (start > 1) {
                    html += `<button class="page-btn" data-page="1">1</button>`;
                    if (start > 2) html += `<span class="page-info">…</span>`;
                }
                for (let i = start; i <= end; i++) {
                    const active = i === current ? 'active' : '';
                    html += `<button class="page-btn ${active}" data-page="${i}">${i}</button>`;
                }
                if (end < total) {
                    if (end < total - 1) html += `<span class="page-info">…</span>`;
                    html += `<button class="page-btn" data-page="${total}">${total}</button>`;
                }

                // 下一页
                const nextDisabled = current >= total;
                html += `<button class="page-btn" data-page="${current + 1}" ${nextDisabled ? 'disabled' : ''}>›</button>`;

                container.innerHTML = html;

                // 事件绑定
                container.querySelectorAll('.page-btn:not(:disabled)').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const p = parseInt(this.dataset.page);
                        if (p && p !== current && p >= 1 && p <= total) {
                            onPage(p);
                        }
                    });
                });
            }

            // ========================================
            // 字体大小控制
            // ========================================
            function setFontSize(size) {
                state.fontSize = Math.min(28, Math.max(12, size));
                document.documentElement.style.setProperty('--reading-font-size', state.fontSize + 'px');
                dom.fontSizeDisplay.textContent = state.fontSize;
                // 更新按钮状态
                dom.fontBtns.forEach(btn => {
                    const val = parseInt(btn.dataset.size);
                    btn.classList.toggle('active', val === state.fontSize);
                });
                // 保存
                try {
                    localStorage.setItem('reader_font_size', String(state.fontSize));
                } catch (_) { /* ignore */ }
            }

            // ========================================
            // 主题切换
            // ========================================
            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                state.theme = next;
                dom.themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
                try {
                    localStorage.setItem('reader_theme', next);
                } catch (_) { /* ignore */ }
            }

            function loadTheme() {
                try {
                    const saved = localStorage.getItem('reader_theme');
                    if (saved === 'dark' || saved === 'light') {
                        state.theme = saved;
                        document.documentElement.setAttribute('data-theme', saved);
                        dom.themeToggle.textContent = saved === 'dark' ? '☀️' : '🌙';
                        return;
                    }
                } catch (_) { /* ignore */ }
                // 系统偏好
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    state.theme = 'dark';
                    document.documentElement.setAttribute('data-theme', 'dark');
                    dom.themeToggle.textContent = '☀️';
                }
            }

            // ========================================
            // 键盘快捷键
            // ========================================
            function handleKeyboard(e) {
                // Ctrl+K 或 / 聚焦搜索
                if ((e.ctrlKey && e.key === 'k') || (e.key === '/' && !e.ctrlKey && !e.metaKey)) {
                    e.preventDefault();
                    if (state.view === 'home') {
                        dom.homeSearchInput.focus();
                    } else {
                        dom.searchInput.focus();
                    }
                    return;
                }
                // 阅读页: 左右方向键翻页
                if (state.view === 'reading') {
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        if (!dom.prevChapter.disabled) goPrevChapter();
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        if (!dom.nextChapter.disabled) goNextChapter();
                    }
                }
                // ESC 返回
                if (e.key === 'Escape') {
                    if (state.view !== 'home') {
                        goBack();
                    }
                }
            }

            // ========================================
            // 初始化事件绑定
            // ========================================
            function init() {
                // ---- 搜索 ----
                function triggerSearch() {
                    const kw = dom.searchInput.value.trim() || dom.homeSearchInput.value.trim();
                    if (kw) {
                        doSearch(kw, 1);
                        dom.searchInput.value = kw;
                    } else {
                        dom.homeSearchInput.focus();
                    }
                }

                dom.searchSubmit.addEventListener('click', triggerSearch);
                dom.searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        triggerSearch();
                    }
                });
                dom.homeSearchBtn.addEventListener('click', triggerSearch);
                dom.homeSearchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        triggerSearch();
                    }
                });

                // ---- 热门标签 ----
                dom.hotTags.addEventListener('click', (e) => {
                    const tag = e.target.closest('.tag');
                    if (tag) {
                        const kw = tag.dataset.keyword;
                        if (kw) {
                            dom.searchInput.value = kw;
                            dom.homeSearchInput.value = kw;
                            doSearch(kw, 1);
                        }
                    }
                });

                // ---- 返回 ----
                dom.btnBack.addEventListener('click', goBack);

                // ---- 章节排序 ----
                dom.sortAsc.addEventListener('click', function() {
                    if (state.chapterSort === 0) return;
                    state.chapterSort = 0;
                    dom.sortAsc.classList.add('active');
                    dom.sortDesc.classList.remove('active');
                    state.chapterPage = 1;
                    fetchChapters();
                });
                dom.sortDesc.addEventListener('click', function() {
                    if (state.chapterSort === 1) return;
                    state.chapterSort = 1;
                    dom.sortDesc.classList.add('active');
                    dom.sortAsc.classList.remove('active');
                    state.chapterPage = 1;
                    fetchChapters();
                });

                // ---- 阅读导航 ----
                dom.prevChapter.addEventListener('click', goPrevChapter);
                dom.nextChapter.addEventListener('click', goNextChapter);

                // ---- 字体控制 ----
                dom.fontBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        const size = parseInt(this.dataset.size);
                        if (size) setFontSize(size);
                    });
                });

                // ---- 主题切换 ----
                dom.themeToggle.addEventListener('click', toggleTheme);

                // ---- 键盘 ----
                document.addEventListener('keydown', handleKeyboard);

                // ---- 浏览器前进/后退 ----
                window.addEventListener('popstate', (e) => {
                    if (e.state && e.state.view) {
                        showView(e.state.view);
                    }
                });

                // ========================================
                // 恢复状态
                // ========================================
                // 加载字体大小
                try {
                    const savedFont = localStorage.getItem('reader_font_size');
                    if (savedFont) {
                        const sz = parseInt(savedFont);
                        if (sz >= 12 && sz <= 28) {
                            state.fontSize = sz;
                            document.documentElement.style.setProperty('--reading-font-size', sz + 'px');
                            dom.fontSizeDisplay.textContent = sz;
                            dom.fontBtns.forEach(btn => {
                                const val = parseInt(btn.dataset.size);
                                btn.classList.toggle('active', val === sz);
                            });
                        }
                    }
                } catch (_) { /* ignore */ }

                // 加载主题
                loadTheme();

                // 显示首页
                showView('home');
                dom.homeSearchInput.focus();

                console.log('📚 小说书库已加载');
                console.log('💡 快捷键: Ctrl+K 搜索 | ← → 翻页 | ESC 返回');
            }

            // ========================================
            // 启动
            // ========================================
            document.addEventListener('DOMContentLoaded', init);

        })();
    </script>

</body>
</html>
