<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📖 小说阅读器 · 书源版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== CSS 变量 & 重置 ===== */
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5a4bd1;
            --primary-light: #a29bfe;
            --bg: #f8f9fe;
            --card: #ffffff;
            --text: #2d3436;
            --text-secondary: #636e72;
            --border: #e9ecf5;
            --shadow: 0 8px 30px rgba(108, 92, 231, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== 主容器 ===== */
        .app {
            width: 100%;
            max-width: 1280px;
            height: 92vh;
            min-height: 600px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ===== 顶部导航 ===== */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 12px;
        }

        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            cursor: default;
            user-select: none;
        }

        .app-header .logo i {
            font-size: 26px;
            background: var(--primary);
            color: #fff;
            padding: 6px 8px;
            border-radius: 10px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-actions .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            color: var(--text-secondary);
        }

        .header-actions .btn:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.3);
        }

        .header-actions .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .header-actions .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4);
        }

        /* ===== 主体布局 ===== */
        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 260px;
            background: var(--bg);
            border-right: 1px solid var(--border);
            padding: 16px 12px;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 4px;
        }

        .sidebar .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            padding: 8px 8px 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar .section-title .badge {
            background: var(--primary-light);
            color: #fff;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
        }

        /* 书架列表 */
        .bookshelf {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bookshelf li {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text);
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
        }

        .bookshelf li:hover {
            background: rgba(108, 92, 231, 0.08);
        }

        .bookshelf li.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 14px rgba(108, 92, 231, 0.35);
        }

        .bookshelf li .book-icon {
            font-size: 18px;
            opacity: 0.7;
            flex-shrink: 0;
        }

        .bookshelf li .book-info {
            flex: 1;
            min-width: 0;
        }

        .bookshelf li .book-info .name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bookshelf li .book-info .progress {
            font-size: 11px;
            opacity: 0.7;
        }

        .bookshelf li .book-del {
            opacity: 0;
            transition: var(--transition);
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 14px;
        }

        .bookshelf li:hover .book-del {
            opacity: 0.5;
        }
        .bookshelf li:hover .book-del:hover {
            opacity: 1;
            color: #ff6b6b;
        }

        .empty-tip {
            color: var(--text-secondary);
            font-size: 13px;
            text-align: center;
            padding: 24px 8px;
            opacity: 0.6;
        }

        /* 书源列表 */
        .source-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .source-list li {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            color: var(--text-secondary);
        }

        .source-list li:hover {
            background: rgba(108, 92, 231, 0.06);
        }

        .source-list li.active {
            background: var(--primary);
            color: #fff;
            font-weight: 500;
        }

        .source-list li .source-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .source-list li .source-name i {
            font-size: 12px;
            opacity: 0.6;
        }

        .source-list li .source-del {
            opacity: 0;
            transition: var(--transition);
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 12px;
        }

        .source-list li:hover .source-del {
            opacity: 0.4;
        }
        .source-list li:hover .source-del:hover {
            opacity: 1;
            color: #ff6b6b;
        }

        /* ===== 主内容区 ===== */
        .main-content {
            flex: 1;
            padding: 24px 32px;
            overflow-y: auto;
            background: var(--card);
            position: relative;
        }

        .main-content::-webkit-scrollbar {
            width: 6px;
        }
        .main-content::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 4px;
        }

        /* 搜索栏 */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .search-bar .search-input-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-bar .search-input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 16px 12px 46px;
            border: 2px solid var(--border);
            border-radius: 30px;
            font-size: 15px;
            background: var(--bg);
            transition: var(--transition);
            outline: none;
            font-family: var(--font);
        }

        .search-bar input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
        }

        .search-bar .btn-search {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            background: var(--primary);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }

        .search-bar .btn-search:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(108, 92, 231, 0.35);
        }

        .search-bar .btn-search:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 内容视图 */
        .view {
            display: none;
            animation: fadeUp 0.35s ease;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 搜索结果 */
        .search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 8px;
        }

        .search-result-item {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 16px;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
            position: relative;
        }

        .search-result-item:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.15);
        }

        .search-result-item .title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .search-result-item .author {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .search-result-item .desc {
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.7;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .search-result-item .add-btn {
            margin-top: 10px;
            padding: 4px 16px;
            border: none;
            border-radius: 20px;
            background: var(--primary);
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }

        .search-result-item .add-btn:hover {
            background: var(--primary-dark);
        }

        .search-result-item .add-btn.added {
            background: #00b894;
            cursor: default;
        }

        /* 阅读器视图 */
        .reader-view .book-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .reader-view .book-meta {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .reader-view .chapter-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .reader-view .chapter-nav select {
            padding: 8px 16px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background: var(--bg);
            font-size: 14px;
            outline: none;
            cursor: pointer;
            font-family: var(--font);
            flex: 1;
            min-width: 150px;
            max-width: 320px;
        }

        .reader-view .chapter-nav select:focus {
            border-color: var(--primary);
        }

        .reader-view .chapter-nav .nav-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            background: var(--bg);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font);
        }

        .reader-view .chapter-nav .nav-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        .reader-view .chapter-nav .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .reader-view .chapter-content {
            font-size: 17px;
            line-height: 2;
            padding: 12px 4px;
            white-space: pre-wrap;
            word-break: break-word;
            color: #2d3436;
            font-family: 'Georgia', 'Segoe UI', serif;
        }

        .reader-view .chapter-content .loading-text {
            color: var(--text-secondary);
            opacity: 0.6;
            text-align: center;
            padding: 60px 0;
        }

        /* 书源管理 */
        .source-mgr .add-source-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 560px;
            background: var(--bg);
            padding: 20px 24px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
        }

        .source-mgr .add-source-form .form-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .source-mgr .add-source-form label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .source-mgr .add-source-form input,
        .source-mgr .add-source-form textarea {
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: var(--font);
            background: #fff;
            transition: var(--transition);
            outline: none;
        }

        .source-mgr .add-source-form input:focus,
        .source-mgr .add-source-form textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.08);
        }

        .source-mgr .add-source-form textarea {
            resize: vertical;
            min-height: 60px;
        }

        .source-mgr .add-source-form .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .source-mgr .add-source-form .form-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .source-mgr .add-source-form .form-actions .btn-submit {
            background: var(--primary);
            color: #fff;
        }

        .source-mgr .add-source-form .form-actions .btn-submit:hover {
            background: var(--primary-dark);
        }

        .source-mgr .add-source-form .form-actions .btn-cancel {
            background: var(--bg);
            color: var(--text-secondary);
        }

        .source-mgr .add-source-form .form-actions .btn-cancel:hover {
            background: #e9ecf5;
        }

        .source-mgr .source-list-mgr {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 560px;
        }

        .source-mgr .source-item-mgr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .source-mgr .source-item-mgr .info {
            display: flex;
            flex-direction: column;
        }

        .source-mgr .source-item-mgr .info .name {
            font-weight: 600;
            font-size: 14px;
        }

        .source-mgr .source-item-mgr .info .url {
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.7;
            word-break: break-all;
        }

        .source-mgr .source-item-mgr .actions {
            display: flex;
            gap: 8px;
        }

        .source-mgr .source-item-mgr .actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .source-mgr .source-item-mgr .actions .btn-edit {
            background: var(--primary-light);
            color: #fff;
        }

        .source-mgr .source-item-mgr .actions .btn-edit:hover {
            background: var(--primary);
        }

        .source-mgr .source-item-mgr .actions .btn-del {
            background: #ff6b6b;
            color: #fff;
        }

        .source-mgr .source-item-mgr .actions .btn-del:hover {
            background: #ee5a24;
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: var(--card);
            border-radius: var(--radius);
            max-width: 520px;
            width: 100%;
            padding: 28px 32px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal .modal-title i {
            color: var(--primary);
        }

        .modal .modal-body {
            margin-bottom: 20px;
        }

        .modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal .modal-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .modal .modal-actions .btn-confirm {
            background: var(--primary);
            color: #fff;
        }

        .modal .modal-actions .btn-confirm:hover {
            background: var(--primary-dark);
        }

        .modal .modal-actions .btn-cancel {
            background: var(--bg);
            color: var(--text-secondary);
        }

        .modal .modal-actions .btn-cancel:hover {
            background: #e9ecf5;
        }

        .modal .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 14px;
        }

        .modal .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .modal .form-group input,
        .modal .form-group textarea {
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: var(--font);
            background: #fff;
            transition: var(--transition);
            outline: none;
        }

        .modal .form-group input:focus,
        .modal .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.08);
        }

        .modal .form-group textarea {
            resize: vertical;
            min-height: 50px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .app {
                height: 96vh;
                border-radius: var(--radius-sm);
            }

            .sidebar {
                width: 200px;
                padding: 12px 8px;
            }

            .main-content {
                padding: 16px 20px;
            }

            .search-results {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 8px;
            }

            .app {
                height: 98vh;
                border-radius: 8px;
            }

            .app-header {
                padding: 12px 16px;
            }
            .app-header .logo {
                font-size: 18px;
            }
            .app-header .logo i {
                font-size: 20px;
                padding: 4px 6px;
            }

            .sidebar {
                display: none;
            }

            .main-content {
                padding: 12px 16px;
            }

            .search-results {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .reader-view .chapter-content {
                font-size: 15px;
                line-height: 1.9;
            }

            .reader-view .book-title {
                font-size: 20px;
            }

            .modal {
                padding: 20px;
            }
        }

        @media (max-width: 440px) {
            .search-results {
                grid-template-columns: 1fr;
            }

            .search-bar .btn-search {
                width: 100%;
                justify-content: center;
            }

            .reader-view .chapter-nav {
                flex-direction: column;
                align-items: stretch;
            }

            .reader-view .chapter-nav select {
                max-width: 100%;
            }
        }

        /* ===== 工具类 ===== */
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .gap-4 {
            gap: 4px;
        }
        .flex {
            display: flex;
        }
        .flex-center {
            align-items: center;
            justify-content: center;
        }
        .text-muted {
            color: var(--text-secondary);
            opacity: 0.6;
        }
        .w-full {
            width: 100%;
        }

        /* toast 通知 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #2d3436;
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 9999;
            pointer-events: none;
            font-family: var(--font);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== 主应用 ===== -->
    <div class="app" id="app">

        <!-- 顶部导航 -->
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>墨读 · 书源版</span>
            </div>
            <div class="header-actions">
                <button class="btn" id="btnSourceMgr" title="管理书源">
                    <i class="fas fa-plug"></i> 书源
                </button>
                <button class="btn btn-primary" id="btnAddBookmark" title="收藏当前小说">
                    <i class="fas fa-star"></i> 收藏
                </button>
                <button class="btn" id="btnRefresh" title="刷新">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </header>

        <!-- 主体 -->
        <div class="app-body">

            <!-- 侧边栏 -->
            <aside class="sidebar" id="sidebar">
                <div>
                    <div class="section-title">
                        📚 书架
                        <span class="badge" id="bookCount">0</span>
                    </div>
                    <ul class="bookshelf" id="bookshelf">
                        <li class="empty-tip">还没有收藏的小说<br />去搜索添加吧 ✨</li>
                    </ul>
                </div>

                <div style="margin-top:auto;border-top:1px solid var(--border);padding-top:12px;">
                    <div class="section-title">
                        🔌 当前书源
                        <span class="badge" id="sourceCount">0</span>
                    </div>
                    <ul class="source-list" id="sourceList">
                        <li class="empty-tip">暂无书源</li>
                    </ul>
                </div>
            </aside>

            <!-- 主内容 -->
            <main class="main-content" id="mainContent">

                <!-- 搜索视图 -->
                <div class="view active" id="viewSearch">
                    <div class="search-bar">
                        <div class="search-input-wrap">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="输入书名或作者…" />
                        </div>
                        <button class="btn-search" id="btnSearch">
                            <i class="fas fa-arrow-right"></i> 搜索
                        </button>
                    </div>
                    <div id="searchResults" class="search-results">
                        <div class="empty-tip" style="grid-column:1/-1;padding:40px 0;">
                            🔍 输入关键词，搜索小说
                        </div>
                    </div>
                </div>

                <!-- 阅读器视图 -->
                <div class="view" id="viewReader">
                    <div class="reader-view" id="readerView">
                        <div class="book-title" id="readerTitle">选择一本小说开始阅读</div>
                        <div class="book-meta" id="readerMeta">
                            <span id="readerAuthor">作者：未知</span>
                            <span id="readerSource">来源：—</span>
                        </div>
                        <div class="chapter-nav">
                            <button class="nav-btn" id="btnPrevChapter"><i class="fas fa-chevron-left"></i> 上一章</button>
                            <select id="chapterSelect"><option value="">加载章节列表…</option></select>
                            <button class="nav-btn" id="btnNextChapter">下一章 <i class="fas fa-chevron-right"></i></button>
                        </div>
                        <div class="chapter-content" id="chapterContent">
                            <div class="loading-text">📖 请从书架或搜索结果中选择小说</div>
                        </div>
                    </div>
                </div>

                <!-- 书源管理视图 -->
                <div class="view" id="viewSourceMgr">
                    <div class="source-mgr">
                        <h2 style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">
                            <i class="fas fa-plug" style="color:var(--primary);"></i> 书源管理
                        </h2>

                        <div class="add-source-form" id="addSourceForm">
                            <div class="form-row">
                                <label>书源名称 *</label>
                                <input type="text" id="sourceNameInput" placeholder="例如：笔趣阁" />
                            </div>
                            <div class="form-row">
                                <label>搜索 URL *（{keyword} 替换关键词）</label>
                                <input type="text" id="sourceSearchUrl" placeholder="https://www.example.com/search?q={keyword}" />
                            </div>
                            <div class="form-row">
                                <label>书籍详情 URL *（{bookId} 替换书籍ID）</label>
                                <input type="text" id="sourceBookUrl" placeholder="https://www.example.com/book/{bookId}/" />
                            </div>
                            <div class="form-row">
                                <label>章节内容 URL *（{bookId} {chapterId} 替换）</label>
                                <input type="text" id="sourceChapterUrl" placeholder="https://www.example.com/book/{bookId}/{chapterId}.html" />
                            </div>
                            <div class="form-row">
                                <label>选择器规则（JSON，可选）</label>
                                <textarea id="sourceSelector" placeholder='{"search":".result .title","book":".book-info","chapter":".content"}'></textarea>
                            </div>
                            <div class="form-actions">
                                <button class="btn-submit" id="btnSaveSource"><i class="fas fa-save"></i> 保存书源</button>
                                <button class="btn-cancel" id="btnCancelSource">取消</button>
                            </div>
                        </div>

                        <h3 style="margin:20px 0 12px;font-size:16px;">已配置的书源</h3>
                        <div class="source-list-mgr" id="sourceListMgr">
                            <div class="empty-tip">暂无书源，请添加</div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- ===== 弹窗：确认删除 ===== -->
    <div class="modal-overlay" id="modalConfirm">
        <div class="modal">
            <div class="modal-title"><i class="fas fa-exclamation-triangle" style="color:#ff6b6b;"></i> 确认删除</div>
            <div class="modal-body" id="modalConfirmBody">确定要删除吗？</div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalConfirmCancel">取消</button>
                <button class="btn-confirm" id="modalConfirmOk" style="background:#ff6b6b;">删除</button>
            </div>
        </div>
    </div>

    <!-- ===== JavaScript ===== -->
    <script>
        // ========================================================================
        //  数据层
        // ========================================================================

        const STORAGE_KEY_BOOKS = 'reader_bookshelf';
        const STORAGE_KEY_SOURCES = 'reader_sources';
        const STORAGE_KEY_CURRENT = 'reader_current';

        // 默认书源（使用 CORS 代理访问笔趣阁）
        const DEFAULT_SOURCES = [{
            id: 'biquge',
            name: '笔趣阁 (www.biquge.com.cn)',
            searchUrl: 'https://corsproxy.io/?url=https://www.biquge.com.cn/search?keyword={keyword}',
            bookUrl: 'https://corsproxy.io/?url=https://www.biquge.com.cn/book/{bookId}/',
            chapterUrl: 'https://corsproxy.io/?url=https://www.biquge.com.cn/book/{bookId}/{chapterId}.html',
            selector: JSON.stringify({
                search: '.result-item',
                searchTitle: '.result-item .title a',
                searchAuthor: '.result-item .author',
                searchBookId: '.result-item .title a',
                bookTitle: '.book-info h1',
                bookAuthor: '.book-info .author',
                bookDesc: '.book-info .desc',
                chapters: '#list dd a',
                chapterContent: '#content'
            })
        }, {
            id: 'bqg',
            name: '笔趣阁 (www.bqg.cc)',
            searchUrl: 'https://corsproxy.io/?url=https://www.bqg.cc/search.php?keyword={keyword}',
            bookUrl: 'https://corsproxy.io/?url=https://www.bqg.cc/book/{bookId}/',
            chapterUrl: 'https://corsproxy.io/?url=https://www.bqg.cc/book/{bookId}/{chapterId}.html',
            selector: JSON.stringify({
                search: '.search-list li',
                searchTitle: '.search-list li .s2 a',
                searchAuthor: '.search-list li .s4',
                searchBookId: '.search-list li .s2 a',
                bookTitle: '.book-title h1',
                bookAuthor: '.book-title .author',
                bookDesc: '.book-intro p',
                chapters: '#list dd a',
                chapterContent: '#content'
            })
        }];

        // ----- 工具函数 -----
        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

        function getData(key, def) {
            try { const d = localStorage.getItem(key); return d ? JSON.parse(d) : def; } catch { return def; }
        }

        function setData(key, val) {
            localStorage.setItem(key, JSON.stringify(val));
        }

        function toast(msg, duration = 2200) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), duration);
        }

        // 解析 HTML
        function parseHTML(html) {
            const parser = new DOMParser();
            return parser.parseFromString(html, 'text/html');
        }

        // 从 URL 提取 bookId
        function extractBookId(url) {
            const m = url.match(/\/book\/([^\/]+)\//);
            return m ? m[1] : null;
        }

        // 从 URL 提取 chapterId
        function extractChapterId(url) {
            const m = url.match(/\/([^\/]+)\.html$/);
            return m ? m[1] : null;
        }

        // ----- 数据操作 -----
        function getBookshelf() { return getData(STORAGE_KEY_BOOKS, []); }

        function saveBookshelf(books) { setData(STORAGE_KEY_BOOKS, books); }

        function getSources() { return getData(STORAGE_KEY_SOURCES, DEFAULT_SOURCES); }

        function saveSources(sources) { setData(STORAGE_KEY_SOURCES, sources); }

        function getCurrent() { return getData(STORAGE_KEY_CURRENT, null); }

        function saveCurrent(curr) { setData(STORAGE_KEY_CURRENT, curr); }

        // 查找书籍
        function findBook(books, bookId) {
            return books.find(b => b.bookId === bookId);
        }

        // 添加或更新书架
        function addToBookshelf(book) {
            const books = getBookshelf();
            const exist = books.find(b => b.bookId === book.bookId && b.sourceId === book.sourceId);
            if (exist) {
                Object.assign(exist, book);
                saveBookshelf(books);
                return exist;
            }
            books.unshift({ ...book, addedAt: Date.now() });
            saveBookshelf(books);
            return books[0];
        }

        // 从书架移除
        function removeFromBookshelf(bookId, sourceId) {
            let books = getBookshelf();
            books = books.filter(b => !(b.bookId === bookId && b.sourceId === sourceId));
            saveBookshelf(books);
            return books;
        }

        // 更新阅读进度
        function updateProgress(bookId, sourceId, chapterId, chapterTitle) {
            const books = getBookshelf();
            const book = books.find(b => b.bookId === bookId && b.sourceId === sourceId);
            if (book) {
                book.lastChapterId = chapterId;
                book.lastChapterTitle = chapterTitle;
                book.lastReadAt = Date.now();
                saveBookshelf(books);
                renderBookshelf();
            }
        }

        // ========================================================================
        //  书源引擎 — 通过代理获取 & 解析
        // ========================================================================

        class SourceEngine {
            constructor(source) {
                this.source = source;
                this.selector = source.selector ? JSON.parse(source.selector) : {};
            }

            // 获取搜索 URL
            getSearchUrl(keyword) {
                return this.source.searchUrl.replace(/\{keyword\}/g, encodeURIComponent(keyword));
            }

            // 获取书籍详情 URL
            getBookUrl(bookId) {
                return this.source.bookUrl.replace(/\{bookId\}/g, bookId);
            }

            // 获取章节 URL
            getChapterUrl(bookId, chapterId) {
                return this.source.chapterUrl
                    .replace(/\{bookId\}/g, bookId)
                    .replace(/\{chapterId\}/g, chapterId);
            }

            // 执行搜索
            async search(keyword) {
                const url = this.getSearchUrl(keyword);
                const html = await this._fetch(url);
                const doc = parseHTML(html);
                const items = this._queryAll(doc, this.selector.search || '.result-item');
                const results = [];
                for (const el of items) {
                    const titleEl = this._query(el, this.selector.searchTitle || '.title a');
                    const authorEl = this._query(el, this.selector.searchAuthor || '.author');
                    const idEl = this._query(el, this.selector.searchBookId || '.title a');
                    const title = titleEl ? titleEl.textContent.trim() : '未知书名';
                    const author = authorEl ? authorEl.textContent.trim() : '未知作者';
                    let bookId = null;
                    if (idEl) {
                        const href = idEl.getAttribute('href') || '';
                        const m = href.match(/\/book\/([^\/]+)\//);
                        bookId = m ? m[1] : null;
                    }
                    if (bookId) {
                        results.push({ title, author, bookId, sourceId: this.source.id, sourceName: this.source.name });
                    }
                }
                return results;
            }

            // 获取书籍详情（章节列表）
            async getBookDetail(bookId) {
                const url = this.getBookUrl(bookId);
                const html = await this._fetch(url);
                const doc = parseHTML(html);
                const titleEl = this._query(doc, this.selector.bookTitle || '.book-info h1');
                const authorEl = this._query(doc, this.selector.bookAuthor || '.book-info .author');
                const descEl = this._query(doc, this.selector.bookDesc || '.book-info .desc');
                const title = titleEl ? titleEl.textContent.trim() : '未知书名';
                const author = authorEl ? authorEl.textContent.trim().replace(/^作者：/, '') : '未知作者';
                const desc = descEl ? descEl.textContent.trim() : '';
                const chapterEls = this._queryAll(doc, this.selector.chapters || '#list dd a');
                const chapters = [];
                for (const el of chapterEls) {
                    const href = el.getAttribute('href') || '';
                    const chapId = href.replace(/\.html$/, '').replace(/^\//, '');
                    const name = el.textContent.trim();
                    if (chapId && name) {
                        chapters.push({ id: chapId, name });
                    }
                }
                return { title, author, desc, chapters };
            }

            // 获取章节内容
            async getChapterContent(bookId, chapterId) {
                const url = this.getChapterUrl(bookId, chapterId);
                const html = await this._fetch(url);
                const doc = parseHTML(html);
                const contentEl = this._query(doc, this.selector.chapterContent || '#content');
                if (!contentEl) return '（未找到章节内容）';
                // 清理
                let text = contentEl.textContent || '';
                text = text.replace(/\s+/g, ' ').trim();
                // 按段落分行
                const paragraphs = text.split(/\s{2,}|。\s*/).filter(p => p.trim());
                return paragraphs.join('\n\n') || text;
            }

            // ----- 内部 helpers -----
            async _fetch(url) {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                return await resp.text();
            }

            _query(doc, sel) {
                try { return doc.querySelector(sel); } catch { return null; }
            }

            _queryAll(doc, sel) {
                try { return [...doc.querySelectorAll(sel)]; } catch { return []; }
            }
        }

        // ========================================================================
        //  UI 控制器
        // ========================================================================

        const state = {
            currentView: 'search', // search | reader | sourceMgr
            currentBook: null, // { bookId, sourceId, title, author, chapters, ... }
            currentChapterId: null,
            currentSourceId: null,
            searchResults: [],
            editingSourceId: null,
        };

        // DOM refs
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const dom = {
            viewSearch: $('#viewSearch'),
            viewReader: $('#viewReader'),
            viewSourceMgr: $('#viewSourceMgr'),
            searchInput: $('#searchInput'),
            btnSearch: $('#btnSearch'),
            searchResults: $('#searchResults'),
            bookshelf: $('#bookshelf'),
            bookCount: $('#bookCount'),
            sourceList: $('#sourceList'),
            sourceCount: $('#sourceCount'),
            sourceListMgr: $('#sourceListMgr'),
            readerTitle: $('#readerTitle'),
            readerAuthor: $('#readerAuthor'),
            readerSource: $('#readerSource'),
            chapterSelect: $('#chapterSelect'),
            chapterContent: $('#chapterContent'),
            btnPrevChapter: $('#btnPrevChapter'),
            btnNextChapter: $('#btnNextChapter'),
            btnAddBookmark: $('#btnAddBookmark'),
            btnSourceMgr: $('#btnSourceMgr'),
            btnRefresh: $('#btnRefresh'),
            // source mgr
            sourceNameInput: $('#sourceNameInput'),
            sourceSearchUrl: $('#sourceSearchUrl'),
            sourceBookUrl: $('#sourceBookUrl'),
            sourceChapterUrl: $('#sourceChapterUrl'),
            sourceSelector: $('#sourceSelector'),
            btnSaveSource: $('#btnSaveSource'),
            btnCancelSource: $('#btnCancelSource'),
            // modal
            modalConfirm: $('#modalConfirm'),
            modalConfirmBody: $('#modalConfirmBody'),
            modalConfirmOk: $('#modalConfirmOk'),
            modalConfirmCancel: $('#modalConfirmCancel'),
        };

        // ----- 渲染函数 -----

        function renderBookshelf() {
            const books = getBookshelf();
            const ul = dom.bookshelf;
            dom.bookCount.textContent = books.length;
            if (books.length === 0) {
                ul.innerHTML = '<li class="empty-tip">📭 还没有收藏的小说<br />去搜索添加吧 ✨</li>';
                return;
            }
            ul.innerHTML = books.map((b, idx) => `
                    <li data-index="${idx}" data-bookid="${b.bookId}" data-sourceid="${b.sourceId}">
                        <span class="book-icon">📖</span>
                        <span class="book-info">
                            <span class="name">${escHtml(b.title || '未命名')}</span>
                            <span class="progress">${b.lastChapterTitle ? '📌 ' + escHtml(b.lastChapterTitle) : (b.author ? '✍️ ' + escHtml(b.author) : '')}</span>
                        </span>
                        <button class="book-del" data-action="del" title="移除"><i class="fas fa-times"></i></button>
                    </li>
                `).join('');

            // 点击进入阅读
            ul.querySelectorAll('li[data-bookid]').forEach(li => {
                li.addEventListener('click', (e) => {
                    if (e.target.closest('.book-del')) return;
                    const bookId = li.dataset.bookid;
                    const sourceId = li.dataset.sourceid;
                    openBook(bookId, sourceId);
                });
            });
            // 删除
            ul.querySelectorAll('.book-del').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const li = btn.closest('li');
                    const bookId = li.dataset.bookid;
                    const sourceId = li.dataset.sourceid;
                    showConfirm('确定要从书架移除《' + (findBook(getBookshelf(), bookId)?.title || '') + '》吗？', () => {
                        removeFromBookshelf(bookId, sourceId);
                        renderBookshelf();
                        toast('已移除');
                    });
                });
            });
        }

        function renderSourceList() {
            const sources = getSources();
            const ul = dom.sourceList;
            dom.sourceCount.textContent = sources.length;
            if (sources.length === 0) {
                ul.innerHTML = '<li class="empty-tip">暂无书源，请添加</li>';
                return;
            }
            const activeId = state.currentSourceId || (sources[0]?.id);
            ul.innerHTML = sources.map(s => `
                    <li data-id="${s.id}" class="${s.id === activeId ? 'active' : ''}">
                        <span class="source-name"><i class="fas fa-circle" style="font-size:8px;color:${s.id === activeId ? '#fff' : 'var(--primary)'};"></i> ${escHtml(s.name)}</span>
                        <button class="source-del" data-action="del" title="删除"><i class="fas fa-trash-alt"></i></button>
                    </li>
                `).join('');

            // 点击切换书源
            ul.querySelectorAll('li[data-id]').forEach(li => {
                li.addEventListener('click', (e) => {
                    if (e.target.closest('.source-del')) return;
                    const id = li.dataset.id;
                    state.currentSourceId = id;
                    renderSourceList();
                    toast('已切换书源：' + (sources.find(s => s.id === id)?.name || id));
                });
            });
            // 删除书源
            ul.querySelectorAll('.source-del').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const li = btn.closest('li');
                    const id = li.dataset.id;
                    showConfirm('确定要删除书源 "' + (sources.find(s => s.id === id)?.name || id) + '" 吗？', () => {
                        let list = getSources();
                        list = list.filter(s => s.id !== id);
                        saveSources(list);
                        if (state.currentSourceId === id) state.currentSourceId = list[0]?.id || null;
                        renderSourceList();
                        renderSourceMgrList();
                        toast('已删除书源');
                    });
                });
            });
        }

        function renderSourceMgrList() {
            const sources = getSources();
            const container = dom.sourceListMgr;
            if (sources.length === 0) {
                container.innerHTML = '<div class="empty-tip">暂无书源，请添加</div>';
                return;
            }
            container.innerHTML = sources.map(s => `
                    <div class="source-item-mgr" data-id="${s.id}">
                        <div class="info">
                            <span class="name">${escHtml(s.name)}</span>
                            <span class="url">${escHtml(s.searchUrl)}</span>
                        </div>
                        <div class="actions">
                            <button class="btn-edit" data-action="edit">编辑</button>
                            <button class="btn-del" data-action="del">删除</button>
                        </div>
                    </div>
                `).join('');

            container.querySelectorAll('[data-action="edit"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.closest('.source-item-mgr').dataset.id;
                    editSource(id);
                });
            });
            container.querySelectorAll('[data-action="del"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.closest('.source-item-mgr').dataset.id;
                    const s = sources.find(s => s.id === id);
                    showConfirm('确定删除书源 "' + (s?.name || id) + '" 吗？', () => {
                        let list = getSources();
                        list = list.filter(s => s.id !== id);
                        saveSources(list);
                        if (state.currentSourceId === id) state.currentSourceId = list[0]?.id || null;
                        renderSourceList();
                        renderSourceMgrList();
                        toast('已删除');
                    });
                });
            });
        }

        function renderSearchResults(results) {
            const container = dom.searchResults;
            if (!results || results.length === 0) {
                container.innerHTML = '<div class="empty-tip" style="grid-column:1/-1;padding:40px 0;">🔍 没有找到相关小说，试试其他关键词</div>';
                return;
            }
            const books = getBookshelf();
            container.innerHTML = results.map(r => {
                const inShelf = books.some(b => b.bookId === r.bookId && b.sourceId === r.sourceId);
                return `
                        <div class="search-result-item" data-bookid="${r.bookId}" data-sourceid="${r.sourceId}">
                            <div class="title">${escHtml(r.title)}</div>
                            <div class="author">✍️ ${escHtml(r.author)}</div>
                            <div class="desc">📌 ${escHtml(r.sourceName || '')}</div>
                            <button class="add-btn ${inShelf ? 'added' : ''}" data-action="add">
                                ${inShelf ? '✅ 已收藏' : '📚 收藏'}
                            </button>
                        </div>
                    `;
            }).join('');

            container.querySelectorAll('[data-action="add"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (btn.classList.contains('added')) return;
                    const item = btn.closest('.search-result-item');
                    const bookId = item.dataset.bookid;
                    const sourceId = item.dataset.sourceid;
                    const r = results.find(res => res.bookId === bookId && res.sourceId === sourceId);
                    if (!r) return;
                    addToBookshelf({
                        bookId: r.bookId,
                        sourceId: r.sourceId,
                        title: r.title,
                        author: r.author,
                        sourceName: r.sourceName,
                    });
                    btn.textContent = '✅ 已收藏';
                    btn.classList.add('added');
                    renderBookshelf();
                    toast('已收藏《' + r.title + '》');
                });
            });

            // 点击进入
            container.querySelectorAll('.search-result-item').forEach(el => {
                el.addEventListener('click', () => {
                    const bookId = el.dataset.bookid;
                    const sourceId = el.dataset.sourceid;
                    openBook(bookId, sourceId);
                });
            });
        }

        function renderReader(book) {
            if (!book) {
                dom.readerTitle.textContent = '选择一本小说开始阅读';
                dom.readerAuthor.textContent = '作者：未知';
                dom.readerSource.textContent = '来源：—';
                dom.chapterSelect.innerHTML = '<option value="">加载章节列表…</option>';
                dom.chapterContent.innerHTML = '<div class="loading-text">📖 请从书架或搜索结果中选择小说</div>';
                return;
            }

            dom.readerTitle.textContent = book.title || '未命名';
            dom.readerAuthor.textContent = '✍️ 作者：' + (book.author || '未知');
            dom.readerSource.textContent = '📌 来源：' + (book.sourceName || '');

            // 渲染章节列表
            if (book.chapters && book.chapters.length > 0) {
                const sel = dom.chapterSelect;
                const currentId = state.currentChapterId || book.lastChapterId || book.chapters[0]?.id;
                sel.innerHTML = book.chapters.map(ch =>
                    `<option value="${ch.id}" ${ch.id === currentId ? 'selected' : ''}>${escHtml(ch.name)}</option>`
                ).join('');
                if (currentId) {
                    loadChapter(book.bookId, book.sourceId, currentId);
                } else if (book.chapters[0]) {
                    loadChapter(book.bookId, book.sourceId, book.chapters[0].id);
                }
            } else {
                dom.chapterSelect.innerHTML = '<option value="">暂无章节</option>';
                dom.chapterContent.innerHTML = '<div class="loading-text">📭 该小说暂无章节</div>';
            }
        }

        // ----- 加载章节内容 -----

        async function loadChapter(bookId, sourceId, chapterId) {
            const sources = getSources();
            const source = sources.find(s => s.id === sourceId);
            if (!source) { toast('书源不存在'); return; }

            const engine = new SourceEngine(source);
            const book = findBook(getBookshelf(), bookId) || state.currentBook;

            dom.chapterContent.innerHTML = '<div class="loading-text">⏳ 加载中…</div>';

            try {
                const content = await engine.getChapterContent(bookId, chapterId);
                // 找到章节名称
                const chapters = book?.chapters || [];
                const ch = chapters.find(c => c.id === chapterId);
                const chapName = ch ? ch.name : '第' + chapterId + '章';

                dom.chapterContent.innerHTML = content || '（本章内容为空）';

                // 更新进度
                state.currentChapterId = chapterId;
                if (book) {
                    updateProgress(bookId, sourceId, chapterId, chapName);
                }
                // 更新 select
                const sel = dom.chapterSelect;
                if (sel.querySelector(`option[value="${chapterId}"]`)) {
                    sel.value = chapterId;
                }

                // 更新按钮状态
                updateNavButtons(bookId, sourceId, chapterId);

            } catch (err) {
                console.error(err);
                dom.chapterContent.innerHTML = `<div class="loading-text" style="color:#ff6b6b;">❌ 加载失败：${err.message || '网络错误'}<br><small>请检查书源配置或网络</small></div>`;
            }
        }

        function updateNavButtons(bookId, sourceId, chapterId) {
            const book = findBook(getBookshelf(), bookId) || state.currentBook;
            if (!book || !book.chapters) {
                dom.btnPrevChapter.disabled = true;
                dom.btnNextChapter.disabled = true;
                return;
            }
            const idx = book.chapters.findIndex(c => c.id === chapterId);
            dom.btnPrevChapter.disabled = idx <= 0;
            dom.btnNextChapter.disabled = idx >= book.chapters.length - 1;
        }

        // ----- 打开书籍 -----

        async function openBook(bookId, sourceId) {
            const sources = getSources();
            const source = sources.find(s => s.id === sourceId);
            if (!source) { toast('书源不存在，请检查配置'); return; }

            const engine = new SourceEngine(source);
            const existing = findBook(getBookshelf(), bookId);

            // 如果已在书架，从书架读取
            if (existing && existing.chapters) {
                state.currentBook = existing;
                state.currentChapterId = existing.lastChapterId || existing.chapters[0]?.id;
                switchView('reader');
                renderReader(existing);
                return;
            }

            // 否则从网络加载
            dom.readerTitle.textContent = '⏳ 加载中…';
            dom.chapterContent.innerHTML = '<div class="loading-text">⏳ 正在获取书籍信息…</div>';
            switchView('reader');

            try {
                const detail = await engine.getBookDetail(bookId);
                const bookData = {
                    bookId,
                    sourceId,
                    title: detail.title,
                    author: detail.author,
                    desc: detail.desc,
                    sourceName: source.name,
                    chapters: detail.chapters,
                    lastChapterId: detail.chapters[0]?.id || null,
                    lastChapterTitle: detail.chapters[0]?.name || null,
                };
                // 保存到书架（自动收藏）
                addToBookshelf(bookData);
                state.currentBook = bookData;
                state.currentChapterId = bookData.lastChapterId;
                renderReader(bookData);
                renderBookshelf();
                toast('已加载《' + detail.title + '》');
            } catch (err) {
                console.error(err);
                dom.chapterContent.innerHTML =
                `<div class="loading-text" style="color:#ff6b6b;">❌ 加载失败：${err.message || '网络错误'}<br><small>请检查书源是否可用</small></div>`;
                dom.readerTitle.textContent = '加载失败';
            }
        }

        // ----- 切换视图 -----

        function switchView(view) {
            state.currentView = view;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            if (view === 'search') dom.viewSearch.classList.add('active');
            else if (view === 'reader') dom.viewReader.classList.add('active');
            else if (view === 'sourceMgr') dom.viewSourceMgr.classList.add('active');
        }

        // ----- 书源管理 -----

        function editSource(id) {
            const sources = getSources();
            const s = sources.find(src => src.id === id);
            if (!s) return;
            dom.sourceNameInput.value = s.name || '';
            dom.sourceSearchUrl.value = s.searchUrl || '';
            dom.sourceBookUrl.value = s.bookUrl || '';
            dom.sourceChapterUrl.value = s.chapterUrl || '';
            dom.sourceSelector.value = s.selector || '';
            state.editingSourceId = id;
            dom.btnSaveSource.textContent = '💾 更新书源';
            dom.btnCancelSource.style.display = 'inline-block';
            dom.sourceNameInput.focus();
        }

        function resetSourceForm() {
            dom.sourceNameInput.value = '';
            dom.sourceSearchUrl.value = '';
            dom.sourceBookUrl.value = '';
            dom.sourceChapterUrl.value = '';
            dom.sourceSelector.value = '';
            state.editingSourceId = null;
            dom.btnSaveSource.textContent = '💾 保存书源';
            dom.btnCancelSource.style.display = 'none';
        }

        function saveSourceFromForm() {
            const name = dom.sourceNameInput.value.trim();
            const searchUrl = dom.sourceSearchUrl.value.trim();
            const bookUrl = dom.sourceBookUrl.value.trim();
            const chapterUrl = dom.sourceChapterUrl.value.trim();
            const selector = dom.sourceSelector.value.trim();

            if (!name) { toast('请输入书源名称'); return; }
            if (!searchUrl || !bookUrl || !chapterUrl) { toast('请填写完整的 URL'); return; }
            if (!searchUrl.includes('{keyword}')) { toast('搜索 URL 必须包含 {keyword}'); return; }
            if (!bookUrl.includes('{bookId}')) { toast('书籍详情 URL 必须包含 {bookId}'); return; }
            if (!chapterUrl.includes('{bookId}') || !chapterUrl.includes('{chapterId}')) {
                toast('章节内容 URL 必须包含 {bookId} 和 {chapterId}');
                return;
            }

            let sources = getSources();
            const newSource = {
                id: state.editingSourceId || uid(),
                name,
                searchUrl,
                bookUrl,
                chapterUrl,
                selector: selector || '{}',
            };

            if (state.editingSourceId) {
                const idx = sources.findIndex(s => s.id === state.editingSourceId);
                if (idx >= 0) sources[idx] = newSource;
                else sources.push(newSource);
            } else {
                sources.push(newSource);
            }

            saveSources(sources);
            resetSourceForm();
            renderSourceList();
            renderSourceMgrList();
            toast('书源已保存');
            // 如果当前无书源，自动选中
            if (!state.currentSourceId) {
                state.currentSourceId = newSource.id;
                renderSourceList();
            }
        }

        // ----- 确认弹窗 -----

        let confirmCallback = null;

        function showConfirm(msg, cb) {
            dom.modalConfirmBody.textContent = msg;
            dom.modalConfirm.classList.add('active');
            confirmCallback = cb;
        }

        function closeConfirm() {
            dom.modalConfirm.classList.remove('active');
            confirmCallback = null;
        }

        // ----- 工具 -----

        function escHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ========================================================================
        //  事件绑定
        // ========================================================================

        // 搜索
        dom.btnSearch.addEventListener('click', doSearch);
        dom.searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

        async function doSearch() {
            const keyword = dom.searchInput.value.trim();
            if (!keyword) { toast('请输入关键词'); return; }

            const sources = getSources();
            const activeId = state.currentSourceId || sources[0]?.id;
            const source = sources.find(s => s.id === activeId);
            if (!source) { toast('请先添加或选择一个书源'); return; }

            dom.btnSearch.disabled = true;
            dom.btnSearch.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 搜索中…';
            dom.searchResults.innerHTML = '<div class="empty-tip" style="grid-column:1/-1;padding:40px 0;">⏳ 搜索中…</div>';

            try {
                const engine = new SourceEngine(source);
                const results = await engine.search(keyword);
                state.searchResults = results.map(r => ({ ...r, sourceId: source.id, sourceName: source.name }));
                renderSearchResults(state.searchResults);
                if (results.length === 0) {
                    toast('没有找到相关小说');
                } else {
                    toast('找到 ' + results.length + ' 本小说');
                }
            } catch (err) {
                console.error(err);
                dom.searchResults.innerHTML =
                    `<div class="empty-tip" style="grid-column:1/-1;padding:40px 0;color:#ff6b6b;">❌ 搜索失败：${err.message || '网络错误'}<br><small>请检查书源配置或网络</small></div>`;
                toast('搜索失败');
            } finally {
                dom.btnSearch.disabled = false;
                dom.btnSearch.innerHTML = '<i class="fas fa-arrow-right"></i> 搜索';
            }
        }

        // 阅读器 - 章节切换
        dom.chapterSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (!val || !state.currentBook) return;
            state.currentChapterId = val;
            loadChapter(state.currentBook.bookId, state.currentBook.sourceId, val);
        });

        dom.btnPrevChapter.addEventListener('click', () => {
            const book = state.currentBook;
            if (!book || !book.chapters) return;
            const idx = book.chapters.findIndex(c => c.id === state.currentChapterId);
            if (idx > 0) {
                const prev = book.chapters[idx - 1];
                state.currentChapterId = prev.id;
                loadChapter(book.bookId, book.sourceId, prev.id);
            }
        });

        dom.btnNextChapter.addEventListener('click', () => {
            const book = state.currentBook;
            if (!book || !book.chapters) return;
            const idx = book.chapters.findIndex(c => c.id === state.currentChapterId);
            if (idx < book.chapters.length - 1) {
                const next = book.chapters[idx + 1];
                state.currentChapterId = next.id;
                loadChapter(book.bookId, book.sourceId, next.id);
            }
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (state.currentView === 'reader') {
                if (e.key === 'ArrowLeft') dom.btnPrevChapter.click();
                else if (e.key === 'ArrowRight') dom.btnNextChapter.click();
            }
        });

        // 收藏当前书籍
        dom.btnAddBookmark.addEventListener('click', () => {
            if (!state.currentBook) { toast('请先打开一本小说'); return; }
            const b = state.currentBook;
            addToBookshelf({
                bookId: b.bookId,
                sourceId: b.sourceId,
                title: b.title,
                author: b.author,
                sourceName: b.sourceName,
                lastChapterId: state.currentChapterId || b.lastChapterId,
                lastChapterTitle: b.chapters?.find(c => c.id === state.currentChapterId)?.name || '',
            });
            renderBookshelf();
            toast('已收藏《' + b.title + '》');
        });

        // 书源管理
        dom.btnSourceMgr.addEventListener('click', () => {
            switchView('sourceMgr');
            renderSourceMgrList();
        });

        dom.btnCancelSource.addEventListener('click', resetSourceForm);
        dom.btnSaveSource.addEventListener('click', saveSourceFromForm);

        // 刷新
        dom.btnRefresh.addEventListener('click', () => {
            if (state.currentView === 'reader' && state.currentBook && state.currentChapterId) {
                loadChapter(state.currentBook.bookId, state.currentBook.sourceId, state.currentChapterId);
                toast('已刷新');
            } else {
                renderBookshelf();
                renderSourceList();
                toast('已刷新');
            }
        });

        // 弹窗
        dom.modalConfirmOk.addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            closeConfirm();
        });
        dom.modalConfirmCancel.addEventListener('click', closeConfirm);
        dom.modalConfirm.addEventListener('click', (e) => {
            if (e.target === dom.modalConfirm) closeConfirm();
        });

        // ========================================================================
        //  初始化
        // ========================================================================

        function init() {
            // 确保有默认书源
            let sources = getSources();
            if (sources.length === 0) {
                saveSources(DEFAULT_SOURCES);
                sources = DEFAULT_SOURCES;
            }

            // 设置当前书源
            state.currentSourceId = sources[0]?.id || null;

            // 渲染
            renderBookshelf();
            renderSourceList();
            renderSourceMgrList();

            // 如果有当前阅读记录
            const current = getCurrent();
            if (current) {
                const book = findBook(getBookshelf(), current.bookId);
                if (book) {
                    state.currentBook = book;
                    state.currentChapterId = current.chapterId || book.lastChapterId;
                    // 重新加载章节列表（确保有 chapters）
                    openBook(book.bookId, book.sourceId);
                    return;
                }
            }

            // 默认显示搜索
            switchView('search');
            dom.searchInput.focus();

            // 尝试自动恢复书架第一个
            const books = getBookshelf();
            if (books.length > 0) {
                const first = books[0];
                // 在侧边栏高亮，但不自动打开
            }
        }

        // 保存当前阅读状态
        function saveCurrentState() {
            if (state.currentBook && state.currentChapterId) {
                saveCurrent({
                    bookId: state.currentBook.bookId,
                    sourceId: state.currentBook.sourceId,
                    chapterId: state.currentChapterId,
                });
            }
        }

        // 在页面关闭时保存
        window.addEventListener('beforeunload', saveCurrentState);
        // 定期保存
        setInterval(saveCurrentState, 10000);

        // 启动
        init();

        // 暴露一些变量方便调试
        window.__app = { state, getSources, getBookshelf, openBook, toast };

        console.log('📖 墨读 · 书源版已启动');
        console.log('💡 提示：可在「书源」中配置自己的书源');
        console.log('📚 默认书源使用 CORS 代理，如遇问题可切换或自定义书源');
    </script>

</body>
</html>
