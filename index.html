<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>云端书屋 · 小说阅读</title>
<style>
  /* ============ 主题变量 ============ */
  :root {
    --primary: #5b8def;
    --primary-dark: #3a6fd8;
    --bg: #f5f7fb;
    --bg-card: #ffffff;
    --text: #1f2937;
    --text-sub: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 2px 12px rgba(0,0,0,.06);
    --shadow-lg: 0 8px 32px rgba(0,0,0,.12);
    --radius: 12px;
  }
  [data-theme="sepia"] {
    --bg: #f4ecd8; --bg-card: #fbf5e6; --text: #3a2e1f; --text-sub: #7a6b54; --border: #e0d4b8;
  }
  [data-theme="green"] {
    --bg: #cce8cf; --bg-card: #e6f2e0; --text: #2d3a2a; --text-sub: #5d6b58; --border: #b8d4b3;
  }
  [data-theme="dark"] {
    --bg: #1a1a1f; --bg-card: #24242b; --text: #d6d6dc; --text-sub: #9aa0a6; --border: #34343c; --shadow: 0 2px 12px rgba(0,0,0,.3);
  }
  [data-theme="black"] {
    --bg: #000000; --bg-card: #0d0d0d; --text: #b8b8b8; --text-sub: #6a6a6a; --border: #1c1c1c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    transition: background .3s, color .3s;
    overflow-x: hidden;
  }

  /* ============ 顶部导航 ============ */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: var(--shadow);
  }
  .navbar h1 {
    font-size: 20px;
    background: linear-gradient(135deg, var(--primary), #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    cursor: pointer;
    user-select: none;
  }
  .nav-tabs { display: flex; gap: 4px; margin-left: 20px; }
  .nav-tab {
    padding: 8px 16px;
    border: none;
    background: transparent;
    color: var(--text-sub);
    cursor: pointer;
    border-radius: 8px;
    font-size: 14px;
    transition: all .2s;
  }
  .nav-tab:hover { background: var(--bg); color: var(--text); }
  .nav-tab.active {
    background: var(--primary);
    color: white;
  }
  .nav-right { margin-left: auto; display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px;
    border: none;
    background: var(--bg);
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
    transition: all .2s;
  }
  .icon-btn:hover { background: var(--primary); color: white; transform: scale(1.05); }

  /* ============ 搜索栏 ============ */
  .search-box {
    max-width: 700px;
    margin: 30px auto;
    padding: 0 20px;
  }
  .search-form {
    display: flex;
    gap: 10px;
    background: var(--bg-card);
    padding: 8px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .search-input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 12px 16px;
    font-size: 15px;
    color: var(--text);
    outline: none;
  }
  .search-source {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 8px;
    padding: 0 12px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
  }
  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }
  .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-ghost {
    background: transparent;
    color: var(--text-sub);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--bg); color: var(--text); }

  /* ============ 主内容区 ============ */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }
  .page { display: none; animation: fadeIn .3s; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ============ 书籍卡片 ============ */
  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .book-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: all .3s;
    display: flex;
    padding: 16px;
    gap: 14px;
  }
  .book-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
  }
  .book-cover {
    width: 80px;
    height: 110px;
    object-fit: cover;
    border-radius: 6px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .book-cover-placeholder {
    width: 80px; height: 110px;
    background: linear-gradient(135deg, var(--primary), #a78bfa);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 24px; font-weight: bold;
    flex-shrink: 0;
  }
  .book-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .book-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .book-author {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .book-abstract {
    font-size: 13px;
    color: var(--text-sub);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }
  .book-source-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--bg);
    color: var(--text-sub);
    margin-top: 6px;
    align-self: flex-start;
  }

  /* ============ 详情页 ============ */
  .detail-hero {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 24px;
    display: flex;
    gap: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }
  .detail-cover {
    width: 140px; height: 190px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: var(--shadow);
  }
  .detail-cover-placeholder {
    width: 140px; height: 190px;
    background: linear-gradient(135deg, var(--primary), #a78bfa);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 48px; font-weight: bold;
    box-shadow: var(--shadow);
  }
  .detail-info { flex: 1; }
  .detail-title { font-size: 26px; margin-bottom: 8px; }
  .detail-author { color: var(--text-sub); margin-bottom: 16px; font-size: 15px; }
  .detail-summary {
    color: var(--text-sub);
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 20px;
    white-space: pre-wrap;
  }
  .detail-actions { display: flex; gap: 12px; flex-wrap: wrap; }

  /* ============ 章节列表 ============ */
  .chapter-list {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 8px;
    max-height: 600px;
    overflow-y: auto;
  }
  .chapter-item {
    padding: 14px 18px;
    cursor: pointer;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all .15s;
    font-size: 14px;
  }
  .chapter-item:hover { background: var(--bg); }
  .chapter-item.read { color: var(--text-sub); }
  .chapter-item.current { background: var(--primary); color: white; }
  .chapter-item.current.read { color: rgba(255,255,255,.7); }

  /* ============ 阅读器 ============ */
  .reader {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
  }
  .reader-header {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: var(--shadow);
  }
  .reader-title {
    flex: 1;
    font-weight: 600;
    font-size: 16px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .reader-progress {
    font-size: 12px;
    color: var(--text-sub);
  }
  .reader-body {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 30px 24px;
    box-shadow: var(--shadow);
    min-height: 60vh;
    line-height: var(--line-height, 1.8);
    font-size: var(--font-size, 18px);
    font-family: var(--font-family, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif);
    transition: background .3s, color .3s;
  }
  .reader-body p { margin-bottom: 1em; text-indent: 2em; }
  .reader-footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 16px;
  }
  .reader-footer .btn { flex: 1; }
  .reader-loading {
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 20px; color: var(--text-sub);
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ 空状态 ============ */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-sub);
  }
  .empty-icon {
    font-size: 64px;
    margin-bottom: 16px;
    opacity: .4;
  }

  /* ============ 抽屉 ============ */
  .drawer-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .drawer-mask.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 320px; max-width: 85vw;
    background: var(--bg-card);
    z-index: 201;
    transform: translateX(-100%);
    transition: transform .25s;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: none; }
  .drawer-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .drawer-title { font-weight: 600; flex: 1; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 8px; }

  /* ============ 设置面板 ============ */
  .settings-panel { background: var(--bg-card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
  .setting-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .setting-item:last-child { border-bottom: none; }
  .setting-label { font-size: 14px; color: var(--text-sub); margin-bottom: 8px; }
  .setting-control { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip {
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    transition: all .2s;
  }
  .chip.active { background: var(--primary); color: white; border-color: var(--primary); }
  input[type="text"], input[type="number"] {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    width: 100%;
  }
  input[type="range"] { flex: 1; }

  /* ============ Key 列表样式 ============ */
  .key-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 8px;
  }
  .key-info { flex: 1; min-width: 0; }
  .key-meta { display: flex; align-items: center; gap: 8px; }
  .key-label { font-weight: 500; font-size: 13px; color: var(--text); }
  .key-masked { font-size: 12px; color: var(--text-sub); font-family: monospace; margin-top: 2px; word-break: break-all; }

  /* ============ Toast ============ */
  .toast {
    position: fixed; top: 80px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--text);
    color: var(--bg-card);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 999;
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ 响应式 ============ */
  @media (max-width: 640px) {
    .navbar { padding: 10px 14px; flex-wrap: wrap; }
    .nav-tabs { margin-left: 0; order: 3; width: 100%; justify-content: center; }
    .search-form { flex-wrap: wrap; }
    .search-source, .btn { width: 100%; }
    .detail-hero { flex-direction: column; align-items: center; text-align: center; }
    .book-card { padding: 12px; }
    .book-cover, .book-cover-placeholder { width: 70px; height: 96px; }
  }
</style>
</head>
<body>

<!-- ============ 顶部导航 ============ -->
<nav class="navbar">
  <h1 onclick="goPage('search')">📚 云端书屋</h1>
  <div class="nav-tabs">
    <button class="nav-tab active" data-page="search" onclick="goPage('search')">搜索</button>
    <button class="nav-tab" data-page="shelf" onclick="goPage('shelf')">书架 <span id="shelf-count" style="opacity:.6"></span></button>
    <button class="nav-tab" data-page="history" onclick="goPage('history')">历史</button>
    <button class="nav-tab" data-page="settings" onclick="goPage('settings')">设置</button>
  </div>
  <div class="nav-right">
    <button class="icon-btn" onclick="toggleTheme()" title="切换主题">🌓</button>
  </div>
</nav>

<!-- ============ 搜索页 ============ -->
<div class="page active" id="page-search">
  <div class="search-box">
    <form class="search-form" onsubmit="event.preventDefault(); doSearch();">
      <input id="search-input" class="search-input" type="text" placeholder="输入书名或作者…" autocomplete="off">
      <select id="search-source" class="search-source">
        <option value="all">全网</option>

      </select>
      <button class="btn" type="submit" id="search-btn">搜索</button>
    </form>
  </div>
  <div class="container">
    <div id="search-status" style="text-align:center;color:var(--text-sub);padding:20px;">输入关键词开始阅读之旅 ✨</div>
    <div class="book-grid" id="search-results"></div>
  </div>
</div>

<!-- ============ 书架 ============ -->
<div class="page" id="page-shelf">
  <div class="container">
    <h2 style="margin:20px 0 16px;font-size:20px;">我的书架</h2>
    <div class="book-grid" id="shelf-grid"></div>
  </div>
</div>

<!-- ============ 历史 ============ -->
<div class="page" id="page-history">
  <div class="container">
    <h2 style="margin:20px 0 16px;font-size:20px;">阅读历史</h2>
    <div id="history-list"></div>
  </div>
</div>

<!-- ============ 设置 ============ -->
<div class="page" id="page-settings">
  <div class="container">
    <h2 style="margin:20px 0 16px;font-size:20px;">偏好设置</h2>
    <div class="settings-panel">

      <div class="setting-item">
        <div class="setting-label">
          🔑 API Key 池
          <span style="font-size:12px;color:var(--text-sub);margin-left:6px;">
            共 <span id="key-count">0</span> 个 · <span id="key-avail">0</span> 可用
          </span>
        </div>
        <div class="setting-control" style="gap:6px;">
          <input type="text" id="api-key-input" placeholder="粘贴新 Key 后点击添加" style="flex:1;">
          <input type="text" id="api-key-label" placeholder="备注（可选）" style="flex:0 0 140px;">
          <button class="btn" onclick="addNewKey()">➕ 添加</button>
        </div>
        <div style="font-size:12px;color:var(--text-sub);margin-top:6px;line-height:1.6;">
          💡 支持多个 Key，自动轮询。网络错误、429 限流、额度耗尽时会自动切换到下一个 Key。
        </div>
      </div>

      <div class="setting-item">
        <div class="setting-label">📋 Key 列表</div>
        <div id="key-list" style="display:flex;flex-direction:column;gap:6px;"></div>
      </div>

      <div class="setting-item">
        <div class="setting-label">🎨 主题</div>
        <div class="setting-control" id="theme-chips">
          <span class="chip" data-theme="light">默认白</span>
          <span class="chip" data-theme="sepia">护眼米黄</span>
          <span class="chip" data-theme="green">护眼绿</span>
          <span class="chip" data-theme="dark">暗色</span>
          <span class="chip" data-theme="black">纯黑</span>
        </div>
      </div>

      <div class="setting-item">
        <div class="setting-label">📝 正文字号 <span id="font-size-val">18px</span></div>
        <div class="setting-control">
          <input type="range" id="font-size" min="14" max="28" value="18" step="1" oninput="updateFontSize(this.value)">
        </div>
      </div>

      <div class="setting-item">
        <div class="setting-label">📏 行距 <span id="line-height-val">1.8</span></div>
        <div class="setting-control">
          <input type="range" id="line-height" min="1.4" max="2.4" value="1.8" step="0.1" oninput="updateLineHeight(this.value)">
        </div>
      </div>

      <div class="setting-item">
        <div class="setting-label">🔤 正文字体</div>
        <div class="setting-control" id="font-chips">
          <span class="chip" data-font="sans">默认无衬线</span>
          <span class="chip" data-font="serif">宋体/衬线</span>
          <span class="chip" data-font="kai">楷体</span>
        </div>
      </div>

      <div class="setting-item">
        <button class="btn btn-ghost" onclick="if(confirm('确认清空所有本地数据？')){localStorage.clear();location.reload();}">🗑 清空本地数据</button>
      </div>

    </div>
  </div>
</div>

<!-- ============ 详情页 ============ -->
<div class="page" id="page-detail">
  <div class="container" id="detail-container"></div>
</div>

<!-- ============ 阅读器 ============ -->
<div class="page" id="page-reader">
  <div class="reader">
    <div class="reader-header">
      <button class="icon-btn" onclick="closeReader()" title="返回">←</button>
      <div class="reader-title" id="reader-book-title">—</div>
      <div class="reader-progress" id="reader-progress">—</div>
      <button class="icon-btn" onclick="toggleToc()" title="目录">☰</button>
    </div>
    <div class="reader-body" id="reader-body">
      <div class="reader-loading"><div class="spinner"></div>正在加载章节…</div>
    </div>
    <div class="reader-footer">
      <button class="btn btn-ghost" id="prev-chapter" onclick="prevChapter()">← 上一章</button>
      <button class="btn btn-ghost" onclick="toggleToc()">目录</button>
      <button class="btn" id="next-chapter" onclick="nextChapter()">下一章 →</button>
    </div>
  </div>
</div>

<!-- ============ 目录抽屉 ============ -->
<div class="drawer-mask" id="drawer-mask" onclick="toggleToc()"></div>
<aside class="drawer" id="toc-drawer">
  <div class="drawer-header">
    <span class="drawer-title">📜 目录</span>
    <button class="icon-btn" onclick="toggleToc()">×</button>
  </div>
  <div class="drawer-body" id="toc-body"></div>
</aside>

<!-- ============ Toast ============ -->
<div class="toast" id="toast"></div>

<script>
/* ===================================================================
 *  小说阅读网站 - 核心逻辑（支持 API Key 轮询池）
 *  后端: https://apione.apibyte.cn/novelsearch
 * ================================================================ */

const API_BASE = 'https://apione.apibyte.cn/novelsearch';

// 触发"换 Key 重试"的错误码（HTTP / 业务码）
const RETRY_HTTP_CODES = [408, 425, 429, 500, 502, 503, 504];
const RETRY_ERROR_CODES = [429, 500, 502, 503, 504];
const QUOTA_EXHAUSTED_CODES = [429];
const QUOTA_EXHAUSTED_KEYWORDS = ['额度', 'quota', 'limit', 'exhausted', 'rate limit', 'too many'];

// ---------- 状态 ----------
const state = {
  // apiKey 已废弃，改用 keyPool
  keyPool: loadKeyPool(),

  theme: localStorage.getItem('theme') || 'light',
  fontSize: +(localStorage.getItem('font_size') || 18),
  lineHeight: +(localStorage.getItem('line_height') || 1.8),
  fontFamily: localStorage.getItem('font_family') || 'sans',

  // 当前阅读
  book: null,            // { book_id, source, title, author, cover, chapters, chapterIndex }
  chapterContent: '',
  shelf: JSON.parse(localStorage.getItem('shelf') || '[]'),
  history: JSON.parse(localStorage.getItem('history') || '[]'),

  // Key 池调度
  _roundRobinIdx: 0
};

/* ---------- Key Pool 存储 ----------
 * 结构: [{ id, key, label, addedAt, cooldownUntil, dead, failCount }]
 * - cooldownUntil: 临时熔断时间戳（毫秒），到期后自动恢复
 * - dead: 永久下线（需用户手动 ↻ 恢复）
 * - failCount: 连续失败次数（用于指数退避）
 */
function loadKeyPool() {
  try {
    const raw = JSON.parse(localStorage.getItem('key_pool') || '[]');
    if (Array.isArray(raw) && raw.length) return raw;

    // 兼容旧版本：把单个 api_key 迁移成第一个 Key
    const legacy = localStorage.getItem('api_key');
    if (legacy) {
      const migrated = [{
        id: 'k_' + Date.now(),
        key: legacy,
        label: '默认 Key',
        addedAt: Date.now(),
        cooldownUntil: 0,
        dead: false,
        failCount: 0
      }];
      localStorage.setItem('key_pool', JSON.stringify(migrated));
      return migrated;
    }
    return [];
  } catch {
    return [];
  }
}

function saveKeyPool() {
  localStorage.setItem('key_pool', JSON.stringify(state.keyPool));
}

// 轮询选择一个当前可用的 Key（跳过 dead / 冷却中）
function pickKey() {
  if (!state.keyPool.length) return null;
  const now = Date.now();
  const n = state.keyPool.length;

  for (let i = 0; i < n; i++) {
    const idx = (state._roundRobinIdx + i) % n;
    const item = state.keyPool[idx];
    if (item.dead) continue;
    if (item.cooldownUntil && item.cooldownUntil > now) continue;
    state._roundRobinIdx = (idx + 1) % n;
    return item;
  }
  return null;
}

// 标记某个 Key 失败（设置冷却 / 永久下线）
function markKeyFailed(keyId, opts = {}) {
  const item = state.keyPool.find(k => k.id === keyId);
  if (!item) return;
  item.failCount = (item.failCount || 0) + 1;

  if (opts.quotaExhausted) {
    // 额度耗尽：临时下线 5 分钟
    item.cooldownUntil = Date.now() + 5 * 60 * 1000;
  } else if (opts.dead) {
    // 永久错误（401/403）：下线，需用户手动恢复
    item.dead = true;
  } else {
    // 普通网络错误：指数退避 30s → 60s → 120s → ... → 上限 5 分钟
    const backoff = Math.min(30 * 1000 * Math.pow(2, item.failCount - 1), 5 * 60 * 1000);
    item.cooldownUntil = Date.now() + backoff;
  }
  saveKeyPool();
}

// 重置某个 Key 状态（恢复可用）
function resetKey(keyId) {
  const item = state.keyPool.find(k => k.id === keyId);
  if (!item) return;
  item.failCount = 0;
  item.cooldownUntil = 0;
  item.dead = false;
  saveKeyPool();
}

function removeKey(keyId) {
  state.keyPool = state.keyPool.filter(k => k.id !== keyId);
  saveKeyPool();
}

function addKey(key, label = '') {
  const trimmed = (key || '').trim();
  if (!trimmed) return { ok: false, reason: 'empty' };
  if (state.keyPool.some(k => k.key === trimmed)) return { ok: false, reason: 'duplicate' };
  state.keyPool.push({
    id: 'k_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    key: trimmed,
    label: label.trim() || `Key ${state.keyPool.length + 1}`,
    addedAt: Date.now(),
    cooldownUntil: 0,
    dead: false,
    failCount: 0
  });
  saveKeyPool();
  return { ok: true };
}

// ---------- DOM 工具 ----------
const $ = id => document.getElementById(id);
const toast = (msg, ms = 2000) => {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), ms);
};
const escapeHtml = s => String(s || '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

// ---------- API 调用（自动换 Key 重试） ----------
async function apiCall(params) {
  const totalKeys = state.keyPool.length;
  // 至少尝试一轮（无 Key 时使用匿名）
  const maxTries = Math.max(totalKeys, 1);
  let lastErr = null;

  for (let attempt = 0; attempt < maxTries; attempt++) {
    const keyItem = pickKey();

    try {
      const url = new URL(API_BASE);
      Object.entries(params).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);
      });
      const headers = {};
      if (keyItem) headers['X-Api-Key'] = keyItem.key;

      let resp;
      try {
        resp = await fetch(url, { headers });
      } catch (networkErr) {
        // fetch 抛错：网络错误
        if (keyItem) markKeyFailed(keyItem.id, {});
        if (attempt < maxTries - 1) continue;
        throw new Error('网络错误：' + (networkErr.message || '无法连接'));
      }

      // HTTP 层错误
      if (!resp.ok) {
        const retriable = RETRY_HTTP_CODES.includes(resp.status);
        if (keyItem) {
          if (resp.status === 401 || resp.status === 403) {
            markKeyFailed(keyItem.id, { dead: true });
          } else if (resp.status === 429) {
            markKeyFailed(keyItem.id, { quotaExhausted: true });
          } else if (retriable) {
            markKeyFailed(keyItem.id, {});
          }
        }
        if (retriable && attempt < maxTries - 1 && keyItem) continue;
        if (retriable && attempt < maxTries - 1 && !keyItem && totalKeys === 0) continue;
        throw new Error('HTTP ' + resp.status);
      }

      const json = await resp.json();

      // 业务层错误
      if (!json || json.code !== 200) {
        const code = json?.code;
        const msg = String(json?.msg || '').toLowerCase();
        const isQuota = QUOTA_EXHAUSTED_CODES.includes(code) ||
                        QUOTA_EXHAUSTED_KEYWORDS.some(k => msg.includes(k));

        if (keyItem) {
          if (code === 401 || code === 403) markKeyFailed(keyItem.id, { dead: true });
          else if (isQuota) markKeyFailed(keyItem.id, { quotaExhausted: true });
          else markKeyFailed(keyItem.id, {});
        }

        const retriable = RETRY_ERROR_CODES.includes(code) || isQuota;
        if (retriable && attempt < maxTries - 1 && keyItem) continue;
        if (retriable && attempt < maxTries - 1 && !keyItem && totalKeys === 0) continue;

        throw new Error(json?.msg || `请求失败 (code ${code || 'unknown'})`);
      }

      // 成功：重置失败计数
      if (keyItem) {
        keyItem.failCount = 0;
        keyItem.cooldownUntil = 0;
        saveKeyPool();
      }
      return json.data;

    } catch (err) {
      lastErr = err;
      if (attempt >= maxTries - 1) throw err;
    }
  }
  throw lastErr || new Error('所有 Key 均不可用');
}

// ---------- 页面切换 ----------
function goPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.page === name));
  $('page-' + name).classList.add('active');

  if (name === 'shelf') renderShelf();
  if (name === 'history') renderHistory();
  if (name === 'settings') { renderSettings(); renderKeyList(); }
  if (name === 'search' && !state._searched) {
    setTimeout(() => $('search-input').focus(), 100);
  }
}

// ---------- 搜索 ----------
async function doSearch() {
  const q = $('search-input').value.trim();
  const source = $('search-source').value;
  if (!q) return toast('请输入关键词');

  $('search-btn').disabled = true;
  $('search-btn').textContent = '搜索中…';
  $('search-status').textContent = '正在搜索…';
  $('search-results').innerHTML = '';

  try {
    const data = await apiCall({ action: 'search', q, source });
    const books = data.books || [];
    $('search-status').textContent = `共找到 ${data.total} 条结果`;
    renderBooks(books, $('search-results'), 'search');
    state._searched = true;
  } catch (e) {
    $('search-status').textContent = '搜索失败：' + e.message;
    toast('搜索失败：' + e.message);
  } finally {
    $('search-btn').disabled = false;
    $('search-btn').textContent = '搜索';
  }
}

// ---------- 渲染书籍卡片 ----------
function renderBooks(books, container) {
  if (!books.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>暂无数据</div>';
    return;
  }
  container.innerHTML = books.map(b => {
    const cover = b.cover
      ? `<img class="book-cover" src="${escapeHtml(b.cover)}" onerror="this.outerHTML='<div class=\\'book-cover-placeholder\\'>${escapeHtml((b.title||'?')[0])}</div>'">`
      : `<div class="book-cover-placeholder">${escapeHtml((b.title||'?')[0])}</div>`;
    const tag = b.source ? `<span class="book-source-tag">${sourceLabel(b.source)}</span>` : '';
    const progressBadge = b._progress ? `<span style="color:var(--primary);font-size:12px;margin-left:6px;">●</span>` : '';
    return `
      <div class="book-card" onclick="openBook('${escapeHtml(b.book_id)}','${escapeHtml(b.source||'qq')}')">
        ${cover}
        <div class="book-info">
          <div class="book-title">${escapeHtml(b.title)}${progressBadge}</div>
          <div class="book-author">${escapeHtml(b.author || '佚名')}</div>
          <div class="book-abstract">${escapeHtml(b.abstract || '暂无简介')}</div>
          ${tag}
        </div>
      </div>`;
  }).join('');
}

function sourceLabel(s) {
  return ({ qq: 'QQ阅读', xiaomi: '小米', fanqie: '番茄', dejian: '得间', qimao: '七猫' })[s] || s;
}

// ---------- 打开书籍：加载详情 ----------
async function openBook(bookId, source) {
  goPage('detail');
  $('detail-container').innerHTML = '<div class="reader-loading"><div class="spinner"></div>加载书籍信息…</div>';

  try {
    const data = await apiCall({ action: 'detail', source, book_id: bookId });

    // 从书架恢复阅读位置
    const shelfItem = state.shelf.find(s => s.book_id === String(bookId) && s.source === source);
    const resumeIndex = shelfItem ? shelfItem.chapterIndex : 0;

    state.book = {
      book_id: String(bookId),
      source,
      title: data.title,
      author: data.author,
      cover: data.cover,
      summary: data.summary,
      chapters: data.chapters || [],
      chapterIndex: Math.min(resumeIndex, Math.max(0, (data.chapters || []).length - 1))
    };

    renderDetail();
  } catch (e) {
    $('detail-container').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>加载失败：${escapeHtml(e.message)}</div>`;
  }
}

function renderDetail() {
  const b = state.book;
  if (!b) return;
  const cover = b.cover
    ? `<img class="detail-cover" src="${escapeHtml(b.cover)}" onerror="this.outerHTML='<div class=\\'detail-cover-placeholder\\'>${escapeHtml((b.title||'?')[0])}</div>'">`
    : `<div class="detail-cover-placeholder">${escapeHtml((b.title||'?')[0])}</div>`;

  const progress = b.chapters.length
    ? `<span style="color:var(--text-sub);font-size:13px;">已读 ${Math.min(b.chapterIndex + 1, b.chapters.length)} / ${b.chapters.length} 章</span>`
    : '';

  $('detail-container').innerHTML = `
    <div class="detail-hero">
      ${cover}
      <div class="detail-info">
        <h1 class="detail-title">${escapeHtml(b.title)}</h1>
        <div class="detail-author">👤 ${escapeHtml(b.author || '佚名')} · 📚 ${sourceLabel(b.source)}</div>
        <div class="detail-summary">${escapeHtml(b.summary || '暂无简介')}</div>
        ${progress}
        <div class="detail-actions" style="margin-top:16px;">
          <button class="btn" onclick="startReading()">${b.chapterIndex > 0 ? '继续阅读' : '开始阅读'}</button>
          <button class="btn btn-ghost" onclick="toggleShelf()">${isInShelf() ? '✓ 已在书架' : '+ 加入书架'}</button>
          ${b.chapters.length ? `<button class="btn btn-ghost" onclick="openChapterByIndex(${'0'})">阅读目录</button>` : ''}
        </div>
      </div>
    </div>
    ${b.chapters.length ? `
      <h3 style="margin:8px 0 12px;font-size:16px;">📜 目录（最近 30 章）</h3>
      <div class="chapter-list" id="detail-chapters">
        ${b.chapters.slice(0, 30).map((c, i) => `
          <div class="chapter-item ${i === b.chapterIndex ? 'current' : ''}" onclick="openChapterByIndex(${i})">
            <span>${escapeHtml(c.title || ('第 ' + (i+1) + ' 章'))}</span>
          </div>`).join('')}
        ${b.chapters.length > 30 ? `<div class="chapter-item" onclick="toggleToc();renderToc();" style="justify-content:center;color:var(--primary);">查看完整目录 (共 ${b.chapters.length} 章)</div>` : ''}
      </div>` : ''}
  `;
}

// ---------- 书架 ----------
function isInShelf() {
  if (!state.book) return false;
  return state.shelf.some(s => s.book_id === state.book.book_id && s.source === state.book.source);
}

function toggleShelf() {
  if (!state.book) return;
  const idx = state.shelf.findIndex(s => s.book_id === state.book.book_id && s.source === state.book.source);
  if (idx >= 0) {
    state.shelf.splice(idx, 1);
    toast('已移出书架');
  } else {
    state.shelf.push({
      book_id: state.book.book_id,
      source: state.book.source,
      title: state.book.title,
      author: state.book.author,
      cover: state.book.cover,
      abstract: state.book.summary,
      chapterIndex: state.book.chapterIndex,
      addedAt: Date.now()
    });
    toast('已加入书架 ✓');
  }
  localStorage.setItem('shelf', JSON.stringify(state.shelf));
  updateShelfCount();
  renderDetail();
}

function updateShelfCount() {
  const el = $('shelf-count');
  if (el) el.textContent = state.shelf.length ? `(${state.shelf.length})` : '';
}

function renderShelf() {
  const grid = $('shelf-grid');
  if (!state.shelf.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">📚</div>书架空空如也<br><small>在搜索页点击「加入书架」收藏喜欢的小说</small></div>';
    return;
  }
  const sorted = [...state.shelf].sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
  const data = sorted.map(b => ({
    title: b.title, author: b.author, cover: b.cover, abstract: b.abstract,
    book_id: b.book_id, source: b.source, _progress: true
  }));
  renderBooks(data, grid);
}

// ---------- 阅读 ----------
async function startReading() { openChapterByIndex(state.book.chapterIndex); }

async function openChapterByIndex(idx) {
  if (!state.book) return;
  idx = Math.max(0, Math.min(idx, state.book.chapters.length - 1));
  state.book.chapterIndex = idx;
  syncShelfProgress();

  goPage('reader');
  toggleToc(false);
  $('reader-book-title').textContent = state.book.title;
  $('reader-progress').textContent = `${idx + 1} / ${state.book.chapters.length}`;
  $('reader-body').innerHTML = '<div class="reader-loading"><div class="spinner"></div>正在加载章节…</div>';

  $('prev-chapter').disabled = idx <= 0;
  $('next-chapter').disabled = idx >= state.book.chapters.length - 1;

  try {
    const data = await apiCall({
      action: 'content',
      source: state.book.source,
      book_id: state.book.book_id,
      chapter_id: state.book.chapters[idx].chapter_id
    });

    state.chapterContent = data.content || '(空章节)';
    $('reader-body').innerHTML = formatContent(state.chapterContent);
    $('reader-body').scrollTop = 0;
    addHistory();
    syncShelfProgress();
  } catch (e) {
    $('reader-body').innerHTML = `<div class="reader-loading">⚠️ 加载失败：${escapeHtml(e.message)}</div>`;
  }
}

function formatContent(text) {
  return text.split(/\r?\n/).filter(l => l.trim()).map(p => `<p>${escapeHtml(p)}</p>`).join('');
}

function prevChapter() { if (state.book && state.book.chapterIndex > 0) openChapterByIndex(state.book.chapterIndex - 1); }
function nextChapter() { if (state.book && state.book.chapterIndex < state.book.chapters.length - 1) openChapterByIndex(state.book.chapterIndex + 1); }

function closeReader() {
  syncShelfProgress();
  if (state._returnPage) goPage(state._returnPage);
  else goPage('search');
}

function syncShelfProgress() {
  if (!state.book) return;
  const idx = state.shelf.findIndex(s => s.book_id === state.book.book_id && s.source === state.book.source);
  if (idx >= 0) {
    state.shelf[idx].chapterIndex = state.book.chapterIndex;
    state.shelf[idx].chapterTitle = state.book.chapters[state.book.chapterIndex]?.title || '';
    localStorage.setItem('shelf', JSON.stringify(state.shelf));
  }
}

// ---------- 目录抽屉 ----------
function toggleToc(force) {
  const open = typeof force === 'boolean' ? force : !$('toc-drawer').classList.contains('open');
  $('toc-drawer').classList.toggle('open', open);
  $('drawer-mask').classList.toggle('open', open);
  if (open) renderToc();
}

function renderToc() {
  if (!state.book || !state.book.chapters) return;
  const cur = state.book.chapterIndex;
  const readSet = new Set();
  for (let i = 0; i < cur; i++) readSet.add(i);

  $('toc-body').innerHTML = `
    <div style="padding:10px 14px;color:var(--text-sub);font-size:13px;border-bottom:1px solid var(--border);">
      📖 当前位置：第 ${cur + 1} 章 · ${escapeHtml(state.book.chapters[cur]?.title || '')}
    </div>
    ${state.book.chapters.map((c, i) => `
      <div class="chapter-item ${i === cur ? 'current' : ''} ${readSet.has(i) ? 'read' : ''}" onclick="openChapterByIndex(${i});toggleToc(false);">
        <span style="opacity:.6;width:50px;flex-shrink:0;">${(i+1).toString().padStart(4,' ')}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(c.title || ('第 ' + (i+1) + ' 章'))}</span>
      </div>`).join('')}
  `;
}

// ---------- 历史 ----------
function addHistory() {
  if (!state.book) return;
  const cur = state.book.chapterIndex;
  const ch = state.book.chapters[cur];
  state.history = state.history.filter(h => !(h.book_id === state.book.book_id && h.source === state.book.source));
  state.history.unshift({
    book_id: state.book.book_id,
    source: state.book.source,
    title: state.book.title,
    author: state.book.author,
    cover: state.book.cover,
    chapterTitle: ch?.title || '',
    chapterIndex: cur,
    time: Date.now()
  });
  state.history = state.history.slice(0, 30);
  localStorage.setItem('history', JSON.stringify(state.history));
}

function renderHistory() {
  const c = $('history-list');
  if (!state.history.length) {
    c.innerHTML = '<div class="empty"><div class="empty-icon">🕓</div>暂无阅读历史</div>';
    return;
  }
  c.innerHTML = state.history.map(h => {
    const cover = h.cover
      ? `<img class="book-cover" src="${escapeHtml(h.cover)}" onerror="this.outerHTML='<div class=\\'book-cover-placeholder\\'>${escapeHtml((h.title||'?')[0])}</div>'">`
      : `<div class="book-cover-placeholder">${escapeHtml((h.title||'?')[0])}</div>`;
    const ago = timeAgo(h.time);
    return `
      <div class="book-card" onclick="openHistory('${escapeHtml(h.book_id)}','${escapeHtml(h.source)}',${h.chapterIndex})">
        ${cover}
        <div class="book-info">
          <div class="book-title">${escapeHtml(h.title)}</div>
          <div class="book-author">${escapeHtml(h.author || '')} · ${sourceLabel(h.source)}</div>
          <div class="book-abstract" style="color:var(--primary);">读到：${escapeHtml(h.chapterTitle || '')}</div>
          <span class="book-source-tag">${ago}</span>
        </div>
      </div>`;
  }).join('');
}

function timeAgo(t) {
  const diff = Date.now() - t;
  const m = Math.floor(diff / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  const d = Math.floor(h / 24);
  return d + ' 天前';
}

async function openHistory(bookId, source, idx) {
  await openBook(bookId, source);
  if (typeof idx === 'number') openChapterByIndex(idx);
}

// ---------- 主题 / 字号 / 行距 / 字体 ----------
function applyTheme() {
  document.documentElement.dataset.theme = state.theme === 'light' ? '' : state.theme;
  document.querySelectorAll('#theme-chips .chip').forEach(c =>
    c.classList.toggle('active', c.dataset.theme === state.theme));
}

function applyReadingStyle() {
  document.documentElement.style.setProperty('--font-size', state.fontSize + 'px');
  document.documentElement.style.setProperty('--line-height', state.lineHeight);
  const fonts = {
    sans: '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif',
    serif: 'Georgia, "Times New Roman", "SimSun", "宋体", serif',
    kai: '"KaiTi", "STKaiti", "楷体", serif'
  };
  document.documentElement.style.setProperty('--font-family', fonts[state.fontFamily] || fonts.sans);
  document.querySelectorAll('#font-chips .chip').forEach(c =>
    c.classList.toggle('active', c.dataset.font === state.fontFamily));
  $('font-size').value = state.fontSize;
  $('line-height').value = state.lineHeight;
  $('font-size-val').textContent = state.fontSize + 'px';
  $('line-height-val').textContent = state.lineHeight;
}

function toggleTheme() {
  const order = ['light', 'sepia', 'green', 'dark', 'black'];
  const i = order.indexOf(state.theme);
  state.theme = order[(i + 1) % order.length];
  localStorage.setItem('theme', state.theme);
  applyTheme();
}

function updateFontSize(v) {
  state.fontSize = +v;
  localStorage.setItem('font_size', v);
  $('font-size-val').textContent = v + 'px';
  document.documentElement.style.setProperty('--font-size', v + 'px');
}

function updateLineHeight(v) {
  state.lineHeight = +v;
  localStorage.setItem('line_height', v);
  $('line-height-val').textContent = v;
  document.documentElement.style.setProperty('--line-height', v);
}

function renderSettings() {
  applyTheme();
  applyReadingStyle();
}

// ---------- Key 列表 UI ----------
function renderKeyList() {
  const list = $('key-list');
  const now = Date.now();
  const avail = state.keyPool.filter(k =>
    !k.dead && (!k.cooldownUntil || k.cooldownUntil <= now)
  ).length;

  $('key-count').textContent = state.keyPool.length;
  $('key-avail').textContent = avail;

  if (!state.keyPool.length) {
    list.innerHTML = '<div style="color:var(--text-sub);font-size:13px;padding:10px 0;">未配置任何 Key，将使用匿名访问（配额较低）。建议添加 1~3 个 Key 以获得稳定体验。</div>';
    return;
  }

  list.innerHTML = state.keyPool.map(k => {
    let badge = '<span style="color:#10b981;">● 可用</span>';
    let cooldownText = '';

    if (k.dead) {
      badge = '<span style="color:#ef4444;">● 已下线</span>';
    } else if (k.cooldownUntil && k.cooldownUntil > now) {
      const remainMs = k.cooldownUntil - now;
      const sec = Math.ceil(remainMs / 1000);
      const mm = Math.floor(sec / 60);
      const ss = sec % 60;
      badge = `<span style="color:#f59e0b;">● 冷却中</span>`;
      cooldownText = `<span style="color:#f59e0b;font-size:12px;margin-left:6px;">${mm}:${ss.toString().padStart(2,'0')} 后恢复</span>`;
    }

    const masked = k.key.length > 12
      ? k.key.slice(0, 4) + '•••••••' + k.key.slice(-4)
      : '••••••••';

    const canReset = k.dead || (k.cooldownUntil && k.cooldownUntil > now);

    return `
      <div class="key-row">
        <div class="key-info">
          <div class="key-meta">
            <span class="key-label">${escapeHtml(k.label)}</span>
            ${badge}
            ${cooldownText}
          </div>
          <div class="key-masked">${escapeHtml(masked)}</div>
        </div>
        <button class="icon-btn" title="恢复" onclick="resetKeyById('${k.id}');renderKeyList();" ${!canReset ? 'disabled style="opacity:.4"' : ''}>↻</button>
        <button class="icon-btn" title="删除" onclick="removeKeyById('${k.id}')">🗑</button>
      </div>
    `;
  }).join('');
}

function resetKeyById(keyId) {
  resetKey(keyId);
  toast('已恢复 ✓');
}

function removeKeyById(keyId) {
  if (!confirm('确认删除该 Key？')) return;
  removeKey(keyId);
  renderKeyList();
  toast('已删除');
}

function addNewKey() {
  const input = $('api-key-input');
  const labelInput = $('api-key-label');
  const result = addKey(input.value, labelInput.value);
  if (!result.ok) {
    if (result.reason === 'duplicate') toast('该 Key 已存在');
    else toast('请输入有效的 Key');
    return;
  }
  input.value = '';
  labelInput.value = '';
  renderKeyList();
  toast('已添加 ✓');
}

// 冷却倒计时：每秒刷新一次（仅在设置页生效）
setInterval(() => {
  const settingsPage = $('page-settings');
  if (settingsPage && settingsPage.classList.contains('active')) {
    renderKeyList();
  }
}, 1000);

// ---------- 主题/字体 chip 点击 ----------
document.addEventListener('click', e => {
  const t = e.target.closest('.chip');
  if (!t) return;
  if (t.parentElement.id === 'theme-chips') {
    state.theme = t.dataset.theme;
    localStorage.setItem('theme', state.theme);
    applyTheme();
  }
  if (t.parentElement.id === 'font-chips') {
    state.fontFamily = t.dataset.font;
    localStorage.setItem('font_family', state.fontFamily);
    applyReadingStyle();
  }
});

// ---------- 键盘翻页 ----------
document.addEventListener('keydown', e => {
  if (!$('page-reader').classList.contains('active')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') prevChapter();
  else if (e.key === 'ArrowRight') nextChapter();
});

// ---------- 初始化 ----------
(function init() {
  applyTheme();
  applyReadingStyle();
  updateShelfCount();
  renderKeyList();
  $('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  // 自动恢复上次页面（仅恢复主页面，不含阅读器）
  const last = localStorage.getItem('last_page');
  if (last && ['shelf', 'history', 'settings'].includes(last)) goPage(last);
})();

// 记录最后访问页面 & 返回页面
const _origGoPage = goPage;
window.goPage = function(name) {
  if (['shelf', 'history', 'settings', 'search'].includes(name)) {
    localStorage.setItem('last_page', name);
    state._returnPage = name;
  }
  _origGoPage(name);
};
</script>
</body>
</html>
